# BigLinux live GRUB entry point.
# Keep platform setup here and user-visible boot choices in kernels.cfg.

insmod part_msdos
insmod part_gpt
insmod regexp
insmod font

function is_efi {
    if [ "${grub_platform}" = "efi" ]; then
        return 0
    fi
    return 1
}

source /boot/grub/variable.cfg
source /boot/grub/defaults.cfg

# Holding Shift disables automatic boot when the active GRUB platform can
# report modifier-key state. Unsupported platforms keep the normal timeout.
if keystatus; then
    if keystatus --shift; then
        set timeout=-1
        set timeout_style=menu
    fi
fi

# Theme labels cannot expand GRUB variables. Keep compact main, support and
# information layouts, then select the platform-specific variant at runtime.
set grub_theme_suffix=""
if [ "${grub_platform}" = "efi" ]; then
    set grub_theme_suffix="-uefi"
elif [ "${grub_platform}" = "pc" ]; then
    set grub_theme_suffix="-bios"
fi

set grub_theme_main_file="${grub_theme_dir}/theme${grub_theme_suffix}.txt"
set grub_theme_support_file="${grub_theme_dir}/theme-support${grub_theme_suffix}.txt"
set grub_theme_detail_file="${grub_theme_dir}/theme-detail${grub_theme_suffix}.txt"
set grub_theme_diagnostics_file="${grub_theme_dir}/theme-diagnostics${grub_theme_suffix}.txt"
set grub_theme_info_file="${grub_theme_dir}/theme-info${grub_theme_suffix}.txt"
set grub_theme_file="${grub_theme_main_file}"
if [ "${biglinux_show_info}" = "true" ]; then
    set grub_theme_file="${grub_theme_info_file}"
elif [ "${biglinux_return_menu}" = "diagnostics" ]; then
    set grub_theme_file="${grub_theme_diagnostics_file}"
elif [ -n "${biglinux_return_menu}" ]; then
    set grub_theme_file="${grub_theme_support_file}"
fi
export grub_theme_main_file
export grub_theme_support_file
export grub_theme_detail_file
export grub_theme_diagnostics_file
export grub_theme_info_file
export grub_theme_file

# Prefer the graphical menu, but keep the console usable when video, font or
# theme initialization fails on unusual firmware.
set biglinux_gfx_modes="1920x1080,1600x900,1366x768,1280x720,1024x768,800x600,auto"
set gfxmode="${biglinux_gfx_modes}"
export biglinux_gfx_modes
set gfxpayload=keep
if loadfont /boot/grub/unicode.pf2; then
    if [ -f "${grub_theme_dir}/ter-u22b.pf2" ]; then
        loadfont "${grub_theme_dir}/ter-u22b.pf2"
    fi
    if [ -f "${grub_theme_dir}/terminus-16.pf2" ]; then
        loadfont "${grub_theme_dir}/terminus-16.pf2"
    fi

    insmod all_video
    insmod gfxterm
    if terminal_output --append gfxterm; then
        terminal_output --remove console
        insmod gfxmenu
        insmod jpeg
        insmod png
        if [ -f "${grub_theme_file}" ]; then
            set theme="${grub_theme_file}"
            export theme
        fi
    fi
fi

set menu_color_normal="white/black"
set menu_color_highlight="black/light-gray"

# Preserve language, keyboard, timezone, custom and loopback arguments. The
# previous configuration assembled these values but did not pass them to Linux.
set auto=""
if [ -n "${iso_path}" ]; then
    set auto="img_loop=${iso_path}"
    if [ -n "${rootuuid}" ]; then
        set auto="img_dev=/dev/disk/by-uuid/${rootuuid} ${auto}"
    fi
fi

set kopts=""
for kopt in "${clinput}" "${bootlang}" "${keyboard}" "${timezone}" "${hwclock}" "${auto}"; do
    if [ -n "${kopt}" ]; then
        if [ -n "${kopts}" ]; then
            set kopts="${kopts} ${kopt}"
        else
            set kopts="${kopt}"
        fi
    fi
done
export kopts

source /boot/grub/kernels.cfg
