        set theme="${grub_theme_support_file}"
        export theme
    fi
    if [ "${biglinux_return_menu}" = "compatibility" ]; then
        unset biglinux_return_menu
        set timeout=-1
    fi

    menuentry "0 Return to main menu" --class=icon-biglinux-back-compatibility --class=return-main --id=biglinux-back-compatibility {
        unset biglinux_return_menu
        set default=biglinux-opt-1-start
        set timeout=-1
        configfile /boot/grub/grub.cfg
