    }

    submenu "9 Diagnostics and tools >" --class=icon-biglinux-cat-9 --class=tools-menu --id=biglinux-cat-9 {
        if [ -f "${grub_theme_diagnostics_file}" ]; then
            set theme="${grub_theme_diagnostics_file}"
            export theme
        fi
        if [ "${biglinux_return_menu}" = "diagnostics" ]; then
            unset biglinux_return_menu
            set timeout=-1
        fi

        menuentry "0 Return to previous menu" --class=icon-biglinux-back-9 --class=return-main --id=biglinux-back-9 {
            set biglinux_return_menu=compatibility
            export biglinux_return_menu
            configfile /boot/grub/grub.cfg
        }

        menuentry "9.1 Show detailed boot messages — disable Plymouth" --class=icon-biglinux-opt-9-1 --class=help --class=@DIST_NAME@.@ARCH@ --id=biglinux-opt-9-1 {
            set gfxpayload=keep
            linux ${live_kernel} ${live_common} wayland ${live_nonfree} plymouth.enable=0 disablehooks=plymouth systemd.show_status=yes rd.udev.log_level=info ${kopts}
            initrd /boot/amd_ucode.img /boot/intel_ucode.img ${live_initrd}
        }

        menuentry "9.2 Trace kernel initialization — deep diagnostics" --class=icon-biglinux-opt-9-2 --class=utilities --class=@DIST_NAME@.@ARCH@ --id=biglinux-opt-9-2 {
            set gfxpayload=keep
            linux ${live_kernel} ${live_common} wayland ${live_nonfree} debug ignore_loglevel initcall_debug log_buf_len=16M plymouth.enable=0 disablehooks=plymouth ${live_debug_ui} ${kopts}
            initrd /boot/amd_ucode.img /boot/intel_ucode.img ${live_initrd}
        }

        menuentry "9.3 Open the installer directly" --class=icon-biglinux-opt-9-3 --class=start-menu --class=@DIST_NAME@.@ARCH@ --id=biglinux-opt-9-3 {
            set gfxpayload=keep
            linux ${live_kernel} ${live_common} wayland ${live_nonfree} biglinux.bootcmd=only-calamares ${live_ui} ${kopts}
            initrd /boot/amd_ucode.img /boot/intel_ucode.img ${live_initrd}
        }

        menuentry "9.4 Open the live desktop directly" --class=icon-biglinux-opt-9-4 --class=biglinux --class=@DIST_NAME@.@ARCH@ --id=biglinux-opt-9-4 {
            set gfxpayload=keep
            linux ${live_kernel} ${live_common} wayland ${live_nonfree} biglinux.bootcmd=boot-in-plasma ${live_ui} ${kopts}
            initrd /boot/amd_ucode.img /boot/intel_ucode.img ${live_initrd}
        }

        menuentry "9.5 Open a terminal directly" --class=icon-biglinux-opt-9-5 --class=edit --class=@DIST_NAME@.@ARCH@ --id=biglinux-opt-9-5 {
            set gfxpayload=keep
            linux ${live_kernel} ${live_common} wayland ${live_nonfree} biglinux.bootcmd=urxvt ${live_ui} ${kopts}
            initrd /boot/amd_ucode.img /boot/intel_ucode.img ${live_initrd}
        }

        menuentry "9.6 Boot to systemd multi-user mode" --class=icon-biglinux-opt-9-6 --class=kernel --class=@DIST_NAME@.@ARCH@ --id=biglinux-opt-9-6 {
            set gfxpayload=text
            linux ${live_kernel} ${live_common} ${live_free} systemd.unit=multi-user.target plymouth.enable=0 disablehooks=plymouth ${live_debug_ui} ${kopts}
            initrd /boot/amd_ucode.img /boot/intel_ucode.img ${live_initrd}
        }

        menuentry "9.7 Boot to systemd rescue mode" --class=icon-biglinux-opt-9-7 --class=recovery --class=@DIST_NAME@.@ARCH@ --id=biglinux-opt-9-7 {
            set gfxpayload=text
            linux ${live_kernel} ${live_common} ${live_free} systemd.unit=rescue.target plymouth.enable=0 disablehooks=plymouth ${live_debug_ui} ${kopts}
            initrd /boot/amd_ucode.img /boot/intel_ucode.img ${live_initrd}
        }

        set memtest_available=false
        if is_efi; then
            if [ -f /boot/memtest-efi ]; then
                set memtest_available=true
            fi
        else
            if [ -f /boot/memtest ]; then
                set memtest_available=true
            fi
        fi
        if [ "${memtest_available}" = true ]; then
            menuentry "9.8 Run Memtest86+" --class=icon-biglinux-opt-9-8 --class=memtest86 --id=biglinux-opt-9-8 {
                if is_efi; then
                    linux /boot/memtest-efi
                else
                    linux16 /boot/memtest
                fi
            }
        fi

        if is_efi; then
            submenu "9.9 Detect EFI bootloaders >" --class=icon-biglinux-opt-9-9 --class=find.efi --id=biglinux-opt-9-9 {
                if [ -f "${grub_theme_detail_file}" ]; then
                    set theme="${grub_theme_detail_file}"
                    export theme
                fi
                menuentry "0 Return to previous menu" --class=icon-biglinux-back-9-9 --class=return-main --id=biglinux-back-9-9 {
                    set biglinux_return_menu=diagnostics
                    export biglinux_return_menu
                    configfile /boot/grub/grub.cfg
                }

                set efi_found=false
                set efi_icon_slots="icon-biglinux-efi-detected-01 icon-biglinux-efi-detected-02 icon-biglinux-efi-detected-03 icon-biglinux-efi-detected-04 icon-biglinux-efi-detected-05 icon-biglinux-efi-detected-06 icon-biglinux-efi-detected-07 icon-biglinux-efi-detected-08 icon-biglinux-efi-detected-09 icon-biglinux-efi-detected-10 icon-biglinux-efi-detected-11 icon-biglinux-efi-detected-12 icon-biglinux-efi-detected-13 icon-biglinux-efi-detected-14 icon-biglinux-efi-detected-15 icon-biglinux-efi-detected-16 icon-biglinux-efi-detected-17 icon-biglinux-efi-detected-18 icon-biglinux-efi-detected-19 icon-biglinux-efi-detected-20 icon-biglinux-efi-detected-21 icon-biglinux-efi-detected-22 icon-biglinux-efi-detected-23 icon-biglinux-efi-detected-24 icon-biglinux-efi-detected-25 icon-biglinux-efi-detected-26 icon-biglinux-efi-detected-27 icon-biglinux-efi-detected-28 icon-biglinux-efi-detected-29 icon-biglinux-efi-detected-30 icon-biglinux-efi-detected-31 icon-biglinux-efi-detected-32"
                for efi in (*,gpt*)/efi/*/*.efi (*,gpt*)/efi/*/*/*.efi (*,msdos*)/efi/*/*.efi (*,msdos*)/efi/*/*/*.efi; do
                    if [ -e "${efi}" ]; then
                        set efi_found=true
                        set efi_class=void
                        if regexp --set=1:efi_class --set=2:efi_icon_slots '^([^ ]+)[ ]*(.*)$' "${efi_icon_slots}"; then
                            true
                        fi
                        regexp --set=1:efi_device '^\((.*)\)/' "${efi}"
                        menuentry --class="${efi_class}" "${efi}" "${efi_device}" {
                            set root="${2}"
                            chainloader "${1}"
                        }
                    fi
                done
                if [ "${efi_found}" != true ]; then
                    menuentry "No EFI bootloaders detected" --class=icon-biglinux-efi-none --class=find.none --id=biglinux-efi-none {
                        true
                    }
                fi
            }
        fi

        menuentry "9.10 Show computer and boot information" --class=icon-biglinux-opt-9-10 --class=computer-info --id=biglinux-opt-9-10 {
            set biglinux_show_info=true
            export biglinux_show_info
            configfile /boot/grub/grub.cfg
        }

        if is_efi; then
            if [ "${feature_efifwsetup_check}" = "y" ]; then
                fwsetup --is-supported
            else
                true
            fi
            if [ "$?" = 0 ]; then
                menuentry "9.11 Open UEFI firmware settings" --class=icon-biglinux-opt-9-11 --class=uefi-firmware --id=biglinux-opt-9-11 {
                    fwsetup
                }
            fi
        fi
    }

}

menuentry "4 Restart computer" --class=icon-biglinux-opt-10-restart --class=reboot --id=biglinux-opt-10-restart {
    reboot
}
fi
