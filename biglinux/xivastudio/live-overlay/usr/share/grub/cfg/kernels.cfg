menuentry "1 Start BigLinux (recommended)" --class=@DIST_NAME@.@ARCH@ {
    set gfxpayload=keep
    linux /boot/vmlinuz-x86_64 misobasedir=manjaro misolabel=BIGLINUXLIVE wayland driver=nonfree nouveau.modeset=0 nvidia-drm.modeset=1 nowatchdog tsc=nowatchdog cryptomgr.notests no_timer_check rw audit=0 split_lock_detect=off quiet loglevel=3 systemd.show_status=auto rd.udev.log_level=3 splash
    initrd /boot/amd_ucode.img /boot/intel_ucode.img /boot/initramfs-@ARCH@.img
}

menuentry "2 Start BigLinux with open source drivers (if 1 fails)" --class=@DIST_NAME@.@ARCH@ {
    set gfxpayload=keep
    linux /boot/vmlinuz-x86_64 misobasedir=manjaro misolabel=BIGLINUXLIVE wayland driver=free nowatchdog tsc=nowatchdog cryptomgr.notests no_timer_check rw audit=0 split_lock_detect=off quiet loglevel=3 systemd.show_status=auto rd.udev.log_level=3 splash
    initrd /boot/amd_ucode.img /boot/intel_ucode.img /boot/initramfs-@ARCH@.img
}

menuentry "3 Start in safe video mode (if the screen stays black)" --class=@DIST_NAME@.@ARCH@ {
    set gfxpayload=keep
    linux /boot/vmlinuz-x86_64 misobasedir=manjaro misolabel=BIGLINUXLIVE wayland driver=free nomodeset module_blacklist=nouveau,nova_core,nova_drm,nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm nowatchdog tsc=nowatchdog cryptomgr.notests no_timer_check rw audit=0 split_lock_detect=off
    initrd /boot/amd_ucode.img /boot/intel_ucode.img /boot/initramfs-@ARCH@.img
}

submenu "4 More options for problems ->" {
    menuentry "Verify the USB pen drive for errors (slow)" --class=@DIST_NAME@.@ARCH@ {
        set gfxpayload=keep
        linux /boot/vmlinuz-x86_64 misobasedir=manjaro misolabel=BIGLINUXLIVE wayland driver=nonfree nouveau.modeset=0 nvidia-drm.modeset=1 nowatchdog tsc=nowatchdog cryptomgr.notests no_timer_check rw audit=0 split_lock_detect=off checksum=y
        initrd /boot/amd_ucode.img /boot/intel_ucode.img /boot/initramfs-@ARCH@.img
    }

    menuentry "Show the start messages, to see the errors" --class=@DIST_NAME@.@ARCH@ {
        set gfxpayload=keep
        linux /boot/vmlinuz-x86_64 misobasedir=manjaro misolabel=BIGLINUXLIVE wayland driver=nonfree nouveau.modeset=0 nvidia-drm.modeset=1 nowatchdog tsc=nowatchdog cryptomgr.notests no_timer_check rw audit=0 split_lock_detect=off
        initrd /boot/amd_ucode.img /boot/intel_ucode.img /boot/initramfs-@ARCH@.img
    }

    menuentry "Notebook with 2 video cards freezes: do not use NVIDIA" --class=@DIST_NAME@.@ARCH@ {
        set gfxpayload=keep
        linux /boot/vmlinuz-x86_64 misobasedir=manjaro misolabel=BIGLINUXLIVE wayland driver=free module_blacklist=nouveau,nova_core,nova_drm,nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm nowatchdog tsc=nowatchdog cryptomgr.notests no_timer_check rw audit=0 split_lock_detect=off quiet loglevel=3 systemd.show_status=auto rd.udev.log_level=3 splash bignvidia=integrated
        initrd /boot/amd_ucode.img /boot/intel_ucode.img /boot/initramfs-@ARCH@.img
    }

    menuentry "Notebook screen blinks, freezes or stays white" --class=@DIST_NAME@.@ARCH@ {
        set gfxpayload=keep
        linux /boot/vmlinuz-x86_64 misobasedir=manjaro misolabel=BIGLINUXLIVE wayland driver=nonfree nouveau.modeset=0 nvidia-drm.modeset=1 nowatchdog tsc=nowatchdog cryptomgr.notests no_timer_check rw audit=0 split_lock_detect=off amdgpu.dcdebugmask=0x410 amdgpu.sg_display=0 i915.enable_psr=0 xe.enable_psr=0
        initrd /boot/amd_ucode.img /boot/intel_ucode.img /boot/initramfs-@ARCH@.img
    }

    menuentry "Errors with the NVMe SSD disk" --class=@DIST_NAME@.@ARCH@ {
        set gfxpayload=keep
        linux /boot/vmlinuz-x86_64 misobasedir=manjaro misolabel=BIGLINUXLIVE wayland driver=nonfree nouveau.modeset=0 nvidia-drm.modeset=1 nowatchdog tsc=nowatchdog cryptomgr.notests no_timer_check rw audit=0 split_lock_detect=off nvme_core.default_ps_max_latency_us=0
        initrd /boot/amd_ucode.img /boot/intel_ucode.img /boot/initramfs-@ARCH@.img
    }

    menuentry "Wi-Fi, disk or USB disconnect: disable energy saving" --class=@DIST_NAME@.@ARCH@ {
        set gfxpayload=keep
        linux /boot/vmlinuz-x86_64 misobasedir=manjaro misolabel=BIGLINUXLIVE wayland driver=nonfree nouveau.modeset=0 nvidia-drm.modeset=1 nowatchdog tsc=nowatchdog cryptomgr.notests no_timer_check rw audit=0 split_lock_detect=off pcie_aspm.policy=performance pcie_port_pm=off ahci.mobile_lpm_policy=1 usbcore.autosuspend=-1
        initrd /boot/amd_ucode.img /boot/intel_ucode.img /boot/initramfs-@ARCH@.img
    }

    menuentry "Random freezes: disable CPU energy saving" --class=@DIST_NAME@.@ARCH@ {
        set gfxpayload=keep
        linux /boot/vmlinuz-x86_64 misobasedir=manjaro misolabel=BIGLINUXLIVE wayland driver=nonfree nouveau.modeset=0 nvidia-drm.modeset=1 nowatchdog tsc=nowatchdog cryptomgr.notests no_timer_check rw audit=0 split_lock_detect=off intel_idle.max_cstate=1 processor.max_cstate=1
        initrd /boot/amd_ucode.img /boot/intel_ucode.img /boot/initramfs-@ARCH@.img
    }

    menuentry "Notebook keyboard does not work" --class=@DIST_NAME@.@ARCH@ {
        set gfxpayload=keep
        linux /boot/vmlinuz-x86_64 misobasedir=manjaro misolabel=BIGLINUXLIVE wayland driver=nonfree nouveau.modeset=0 nvidia-drm.modeset=1 nowatchdog tsc=nowatchdog cryptomgr.notests no_timer_check rw audit=0 split_lock_detect=off i8042.nopnp=1 i8042.dumbkbd=1
        initrd /boot/amd_ucode.img /boot/intel_ucode.img /boot/initramfs-@ARCH@.img
    }

    menuentry "Freezes at start with DMAR or AMD-Vi errors: disable IOMMU" --class=@DIST_NAME@.@ARCH@ {
        set gfxpayload=keep
        linux /boot/vmlinuz-x86_64 misobasedir=manjaro misolabel=BIGLINUXLIVE wayland driver=nonfree nouveau.modeset=0 nvidia-drm.modeset=1 nowatchdog tsc=nowatchdog cryptomgr.notests no_timer_check rw audit=0 split_lock_detect=off iommu=off intremap=off
        initrd /boot/amd_ucode.img /boot/intel_ucode.img /boot/initramfs-@ARCH@.img
    }

    menuentry "Open only the installer (if the desktop does not open)" --class=@DIST_NAME@.@ARCH@ {
        set gfxpayload=keep
        linux /boot/vmlinuz-x86_64 misobasedir=manjaro misolabel=BIGLINUXLIVE wayland driver=nonfree nouveau.modeset=0 nvidia-drm.modeset=1 nowatchdog tsc=nowatchdog cryptomgr.notests no_timer_check rw audit=0 split_lock_detect=off quiet loglevel=3 systemd.show_status=auto rd.udev.log_level=3 splash biglinux.bootcmd=only-calamares
        initrd /boot/amd_ucode.img /boot/intel_ucode.img /boot/initramfs-@ARCH@.img
    }

    menuentry "Text mode (user and password: xivastudio)" --class=@DIST_NAME@.@ARCH@ {
        set gfxpayload=keep
        linux /boot/vmlinuz-x86_64 misobasedir=manjaro misolabel=BIGLINUXLIVE wayland driver=nonfree nouveau.modeset=0 nvidia-drm.modeset=1 nowatchdog tsc=nowatchdog cryptomgr.notests no_timer_check rw audit=0 split_lock_detect=off systemd.unit=multi-user.target
        initrd /boot/amd_ucode.img /boot/intel_ucode.img /boot/initramfs-@ARCH@.img
    }

    menuentry "Last option: very old computers (uses 1 CPU core)" --class=@DIST_NAME@.@ARCH@ {
        set gfxpayload=keep
        linux /boot/vmlinuz-x86_64 misobasedir=manjaro misolabel=BIGLINUXLIVE wayland driver=nonfree nouveau.modeset=0 nvidia-drm.modeset=1 nowatchdog tsc=nowatchdog cryptomgr.notests no_timer_check rw audit=0 split_lock_detect=off nopat noapic nolapic irqpoll hpet=disable
        initrd /boot/amd_ucode.img /boot/intel_ucode.img /boot/initramfs-@ARCH@.img
    }

    menuentry "Last option: ACPI disabled (1 CPU core, no energy saving)" --class=@DIST_NAME@.@ARCH@ {
        set gfxpayload=keep
        linux /boot/vmlinuz-x86_64 misobasedir=manjaro misolabel=BIGLINUXLIVE wayland driver=nonfree nouveau.modeset=0 nvidia-drm.modeset=1 nowatchdog tsc=nowatchdog cryptomgr.notests no_timer_check rw audit=0 split_lock_detect=off acpi=off
        initrd /boot/amd_ucode.img /boot/intel_ucode.img /boot/initramfs-@ARCH@.img
    }
}
