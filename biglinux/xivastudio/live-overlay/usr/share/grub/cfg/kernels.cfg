# BigLinux live boot menu.
#
# Support codes are a public interface. Never renumber or reuse a released code.
# Add new entries at the end of the matching category or in a reserved gap.
# The normal path intentionally uses only nmi_watchdog=0 as a policy override.

set live_kernel="/boot/vmlinuz-x86_64"
set live_initrd="/boot/initramfs-@ARCH@.img"
set live_common="misobasedir=manjaro misolabel=BIGLINUXLIVE rw nmi_watchdog=0"
set live_ui="quiet splash loglevel=3 systemd.show_status=auto rd.udev.log_level=err"
set live_debug_ui="loglevel=7 systemd.show_status=yes rd.udev.log_level=debug"
set live_nonfree="driver=nonfree nouveau.modeset=0"
set live_free="driver=free"

# The information view is a separate graphical menu state. This keeps SMBIOS
# probing out of normal menu startup while preserving the active GRUB theme.
if [ "${biglinux_show_info}" = "true" ]; then
    unset biglinux_show_info
    set timeout=-1

    set biglinux_firmware_mode="${grub_platform}"
    if is_efi; then
        set biglinux_firmware_mode="UEFI"
    elif [ "${grub_platform}" = "pc" ]; then
        set biglinux_firmware_mode="BIOS"
    fi
    set biglinux_grub_arch="${grub_cpu}"
    set biglinux_system_manufacturer="Not reported by firmware"
    set biglinux_system_product="Not reported by firmware"
    set biglinux_firmware_vendor="Not reported by firmware"
    set biglinux_firmware_version="Not reported by firmware"

    if [ -f "${prefix}/smbios.mod" ]; then
        if insmod smbios; then
            smbios --type 0 --get-string 4 --set biglinux_firmware_vendor
            smbios --type 0 --get-string 5 --set biglinux_firmware_version
            smbios --type 1 --get-string 4 --set biglinux_system_manufacturer
            smbios --type 1 --get-string 5 --set biglinux_system_product
        fi
    fi

    set biglinux_boot_root="(${root})"
    set biglinux_boot_filesystem="Not available"
    probe --set biglinux_boot_filesystem --fs "${root}"
    set biglinux_boot_uuid="${rootuuid}"
    if [ -z "${biglinux_boot_uuid}" ]; then
        probe --set biglinux_boot_uuid --fs-uuid "${root}"
    fi
    if [ -z "${biglinux_boot_uuid}" ]; then
        set biglinux_boot_uuid="Not available"
    fi

    menuentry "0 Return to diagnostics and tools" --class=icon-biglinux-info-back --class=return-main --id=biglinux-info-back {
        set biglinux_return_menu=diagnostics
        export biglinux_return_menu
        configfile /boot/grub/grub.cfg
    }
    menuentry "Firmware mode: ${biglinux_firmware_mode}" --class=icon-biglinux-info-firmware-mode --class=void --id=biglinux-info-firmware-mode { true }
    menuentry "GRUB architecture: ${biglinux_grub_arch}" --class=icon-biglinux-info-grub-arch --class=void --id=biglinux-info-grub-arch { true }
    menuentry "System manufacturer: ${biglinux_system_manufacturer}" --class=icon-biglinux-info-system-manufacturer --class=void --id=biglinux-info-system-manufacturer { true }
    menuentry "System product: ${biglinux_system_product}" --class=icon-biglinux-info-system-product --class=void --id=biglinux-info-system-product { true }
    menuentry "Firmware vendor: ${biglinux_firmware_vendor}" --class=icon-biglinux-info-firmware-vendor --class=void --id=biglinux-info-firmware-vendor { true }
    menuentry "Firmware version: ${biglinux_firmware_version}" --class=icon-biglinux-info-firmware-version --class=void --id=biglinux-info-firmware-version { true }
    menuentry "Boot root: ${biglinux_boot_root}" --class=icon-biglinux-info-boot-root --class=void --id=biglinux-info-boot-root { true }
    menuentry "Boot filesystem: ${biglinux_boot_filesystem}" --class=icon-biglinux-info-boot-filesystem --class=void --id=biglinux-info-boot-filesystem { true }
    menuentry "Boot filesystem UUID: ${biglinux_boot_uuid}" --class=icon-biglinux-info-boot-uuid --class=void --id=biglinux-info-boot-uuid { true }
    menuentry "Preferred graphics: 1920x1080, 1600x900, 1366x768" --class=icon-biglinux-info-gfx-primary --class=void --id=biglinux-info-gfx-primary { true }
    menuentry "Graphics fallbacks: 1280x720, 1024x768, 800x600, auto" --class=icon-biglinux-info-gfx-fallback --class=void --id=biglinux-info-gfx-fallback { true }
    menuentry "Active theme: BigLinux live" --class=icon-biglinux-info-theme --class=void --id=biglinux-info-theme { true }
else
if [ "${biglinux_return_menu}" = "diagnostics" ]; then
    set default="biglinux-cat-compatibility>biglinux-cat-9"
    set timeout=0
elif [ "${biglinux_return_menu}" = "compatibility" ]; then
    set default=biglinux-cat-compatibility
    set timeout=0
fi

menuentry "1 Start BigLinux" --class=icon-biglinux-opt-1-start --class=start-menu --class=@DIST_NAME@.@ARCH@ --id=biglinux-opt-1-start {
    set gfxpayload=keep
    linux ${live_kernel} ${live_common} wayland ${live_nonfree} ${live_ui} ${kopts}
    initrd /boot/amd_ucode.img /boot/intel_ucode.img ${live_initrd}
}

menuentry "2 Start without proprietary drivers" --class=icon-biglinux-opt-1-free --class=opensource-drivers --class=@DIST_NAME@.@ARCH@ --id=biglinux-opt-1-free {
    set gfxpayload=keep
    linux ${live_kernel} ${live_common} wayland ${live_free} ${live_ui} ${kopts}
    initrd /boot/amd_ucode.img /boot/intel_ucode.img ${live_initrd}
}

