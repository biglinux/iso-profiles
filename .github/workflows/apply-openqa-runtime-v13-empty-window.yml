name: Apply reviewed openQA empty-window correction

on:
  push:
    branches:
      - fix/openqa-nonvisual-accessibility-20260914
    paths:
      - .github/workflows/apply-openqa-runtime-v13-empty-window.yml
      - openqa/.runtime-v13-empty-window.patch

permissions:
  contents: write

concurrency:
  group: openqa-runtime-v13-empty-window-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify the reviewed correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~2)" = "3075bb5acb733afef8fa8d1755972a05921404d9"
          echo '876d21270a898ac5b784861c0de3996621e662d93581850e9c8ea4455bfb2bcb  openqa/.runtime-v13-empty-window.patch' | sha256sum --check
          git rm \
            openqa/.runtime-v13-empty-window.patch \
            .github/workflows/apply-openqa-runtime-v13-empty-window.yml
          test "$(git write-tree)" = "4ce3e69b3e680e78ab651f5f57d5e5a7bf9b77bf"
          git show HEAD:openqa/.runtime-v13-empty-window.patch > "$RUNNER_TEMP/empty-window.patch"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/empty-window.patch"
          test "$(git write-tree)" = "e4a53140c2f9f320c7a16f86db6525ffc2f9ad33"
          mapfile -t changed < <(git diff --cached --name-only HEAD~2)
          diff -u \
            <(printf '%s\n' data/atspi_probe.py data/test_application_smoke.py) \
            <(printf '%s\n' "${changed[@]}")

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r openqa/report/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core \
            dbus-x11 xvfb openbox xdotool shellcheck
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate the exact implementation
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          {
            python3 -m unittest discover -s data -p 'test_*.py'
            python3 -m unittest discover -s openqa/data -p 'test_*.py'
            python3 -m unittest discover -s openqa/report -p 'test_*.py'
            python3 -m py_compile \
              data/*.py openqa/production/*.py openqa/report/*.py openqa/integration/*.py
            python3 openqa/production/check-nonvisual.py
            prove -Iopenqa/t/lib -Iopenqa/lib openqa/t/*.t
            for script in openqa/production/*.sh data/*.sh; do bash -n "$script"; done
            shellcheck -x openqa/production/*.sh data/*.sh
            "$RUNNER_TEMP/bin/actionlint" -color \
              .github/workflows/openqa*.yml \
              .github/workflows/mirror-openqa-image.yml \
              .github/workflows/validate-iso-once.yml
            git diff --cached --check
            test "$(git write-tree)" = "e4a53140c2f9f320c7a16f86db6525ffc2f9ad33"
            dbus-run-session -- xvfb-run -a /usr/bin/python3 \
              openqa/integration/accessible_smoke.py
          } 2>&1 | tee "$RUNNER_TEMP/empty-window-validation.log"

      - name: Publish the validated correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "e4a53140c2f9f320c7a16f86db6525ffc2f9ad33"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'fix(openqa): fail a fully scanned empty accessible window' \
            -m 'Treat expiry before a new traversal starts as confirmed absence after prior complete scans. Expiry during traversal, node limits, cycles and missing children remain inconclusive and blocking.'
          test "$(git rev-parse HEAD^{tree})" = "e4a53140c2f9f320c7a16f86db6525ffc2f9ad33"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: openqa-empty-window-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/empty-window-validation.log
          retention-days: 7
          if-no-files-found: warn
