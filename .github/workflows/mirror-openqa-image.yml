name: Mirror the openQA image

# Import only a reviewed, immutable upstream image. Never resolve latest here.
# Reuse the existing mirror so release validation survives upstream retention.
on:
  workflow_dispatch:
    inputs:
      source:
        description: Reviewed upstream digest (empty uses openqa-image-source.txt)
        required: false
        type: string
  workflow_call:
    outputs:
      image:
        description: Verified immutable GHCR reference
        value: ${{ jobs.mirror.outputs.image }}

permissions:
  contents: read
  packages: write

concurrency:
  group: openqa-image-mirror-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Preserve and verify the reviewed runner image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image: ${{ steps.copy.outputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install image-copy tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Verify or copy the exact image
        id: copy
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REQUESTED_SOURCE: ${{ inputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/openqa-registry-auth.json"
          trap 'rm -f -- "$REGISTRY_AUTH_FILE"' EXIT
          source_image=${REQUESTED_SOURCE:-$(tr -d '[:space:]' < openqa/openqa-image-source.txt)}
          [[ "$source_image" =~ ^registry\.opensuse\.org/devel/openqa/containers/opensuse/openqa-single-instance(:[A-Za-z0-9._-]+)?@sha256:[a-f0-9]{64}$ ]] || {
            echo 'Only a digest-pinned image from the reviewed upstream is accepted.' >&2
            exit 1
          }
          digest=${source_image##*@}
          # containers/image (used by Skopeo) rejects name:tag@digest.
          # The digest is the identity; the version tag is provenance only.
          source_image="registry.opensuse.org/devel/openqa/containers/opensuse/openqa-single-instance@$digest"
          target="ghcr.io/${GITHUB_REPOSITORY,,}/openqa-single-instance@$digest"
          destination="ghcr.io/${GITHUB_REPOSITORY,,}/openqa-single-instance:${digest#sha256:}"
          if [[ -z "$REQUESTED_SOURCE" ]]; then
            test "$(tr -d '[:space:]' < openqa/openqa-image.txt)" = "$target"
          fi
          printf '%s' "$REGISTRY_TOKEN" | skopeo login \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          manifest="$RUNNER_TEMP/openqa-mirror-manifest.json"
          if ! skopeo inspect --raw "docker://$target" > "$manifest"; then
            skopeo copy --retry-times 3 --all --preserve-digests \
              "docker://$source_image" "docker://$destination"
            skopeo inspect --raw "docker://$target" > "$manifest"
          fi
          test "$(skopeo manifest-digest "$manifest")" = "$digest"
          printf 'image=%s\n' "$target" >> "$GITHUB_OUTPUT"
          printf 'Verified runner image: `%s`\n' "$target" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: openqa-runner-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openqa-mirror-manifest.json
          retention-days: 14
          if-no-files-found: warn
