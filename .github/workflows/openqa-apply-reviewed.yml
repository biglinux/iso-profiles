name: Apply and validate reviewed nonvisual patch

on:
  push:
    branches: ['fix/openqa-nonvisual-accessibility-20260914']
    paths: ['.openqa-review-*', '.github/workflows/openqa-apply-reviewed.yml']

permissions:
  contents: read

jobs:
  reviewed:
    if: github.repository == 'biglinux/iso-profiles' && github.ref == 'refs/heads/fix/openqa-nonvisual-accessibility-20260914'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Apply the immutable, locally tested patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~2)" = ed5a334101bb4460904710d63cf3eb8a68a6c717
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          encoded = b''.join(pathlib.Path(f'.openqa-review-{i}').read_bytes() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '91976bff7ed70d3b0dc5410c15b6bd3a8ebb4ccacbac73c67f5c5f65b5ef00c3'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          PY
          git rm -- openqa/needles/biglinux-sddm-login.png .openqa-review-0 .openqa-review-1 .openqa-review-2 .openqa-review-3 .github/workflows/openqa-apply-reviewed.yml
          test "$(git write-tree)" = d06f2cd68f21630d7bb8169911f878045e37d766
      - name: Run regression and source-policy checks
        run: |
          set -euo pipefail
          {
            python3 -m unittest discover -s data -p 'test_*.py'
            python3 -m unittest discover -s openqa/data -p 'test_*.py'
            python3 -m unittest discover -s openqa/report -p 'test_*.py'
            prove -Iopenqa/t/lib -Iopenqa/lib openqa/t/*.t
            python3 openqa/production/check-nonvisual.py
            python3 -m py_compile data/*.py openqa/production/*.py openqa/report/*.py
            for script in openqa/production/*.sh data/*.sh; do bash -n "$script"; done
            ruby -ryaml -e 'ARGV.each { |f| YAML.safe_load_file(f, permitted_classes: [], aliases: false) }' .github/workflows/openqa*.yml openqa/*.yaml
            git diff --cached --check
          } 2>&1 | tee "$RUNNER_TEMP/nonvisual-validation.log"
          test "$(git write-tree)" = d06f2cd68f21630d7bb8169911f878045e37d766
      - name: Upload content blobs for authorized connector publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args])
          assert os.environ['GITHUB_REPOSITORY'] == 'biglinux/iso-profiles'
          parent = git('rev-parse', 'HEAD').decode().strip()
          expected = 'd06f2cd68f21630d7bb8169911f878045e37d766'
          assert git('write-tree').decode().strip() == expected
          def post(endpoint, payload):
              request = urllib.request.Request(
                  'https://api.github.com/repos/biglinux/iso-profiles/git/' + endpoint,
                  data=json.dumps(payload).encode('utf-8'), method='POST',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          entries = []
          for raw in git('diff', '--cached', '--name-only', '-z').split(b'\0'):
              if not raw:
                  continue
              name = raw.decode('utf-8')
              index = git('ls-files', '--stage', '--', name).decode().strip()
              if not index:
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode, local_sha, _ = index.split(maxsplit=2)
              assert mode in ('100644', '100755')
              content = git('show', ':' + name).decode('utf-8')
              blob = post('blobs', {'content': content, 'encoding': 'utf-8'})
              assert blob['sha'] == local_sha
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          manifest = {'tree_sha': expected, 'parent_sha': parent,
                      'base_tree_sha': git('rev-parse', 'HEAD^{tree}').decode().strip(),
                      'tree_elements': entries,
                      'patch_sha256': '91976bff7ed70d3b0dc5410c15b6bd3a8ebb4ccacbac73c67f5c5f65b5ef00c3',
                      'regressions': 'passed; see log for dependency-based skips',
                      'iso_executed': False, 'branch_moved': False}
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'nonvisual-publication.json'
          destination.write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nonvisual-reviewed-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nonvisual-publication.json
            ${{ runner.temp }}/nonvisual-validation.log
          if-no-files-found: error
          retention-days: 7
