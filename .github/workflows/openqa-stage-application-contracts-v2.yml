name: Validate reviewed application contracts v2
on:
  push:
    branches: [fix/openqa-nonvisual-accessibility-20260914]
    paths:
      - .github/workflows/openqa-stage-application-contracts-v2.yml
      - .openqa-application-contracts-v2/**
permissions:
  contents: write
jobs:
  reviewed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply checksum-pinned change
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/application-contracts-v2-validation.log"
          test "$(git rev-parse HEAD^)" = 4245ebaa1e7754552d8ad5bffec7133d3e53787c
          cat .openqa-application-contracts-v2/part-* > "$RUNNER_TEMP/payload.b64"
          echo 'a0ee83cb072e28bd05b5ab25b5c1a56ca2b46d71cc99b9c92998821757fe20be  '"$RUNNER_TEMP/payload.b64" | sha256sum --check
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          payload = pathlib.Path(os.environ['RUNNER_TEMP'], 'payload.b64').read_bytes()
          patch = lzma.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'e75c1b2bc80370e826f744029c7dd4574da46428ca4372991659f8991e006dc8'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          git rm -r .openqa-application-contracts-v2 .github/workflows/openqa-stage-application-contracts-v2.yml
          git diff --cached --check
      - name: Install test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -r openqa/report/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core dbus-x11 xvfb openbox xdotool
      - name: Validate policy contracts, reports and real AT-SPI fixture
        run: |
          set -euo pipefail
          ulimit -c 0
          {
            python3 -m unittest discover -s data -p 'test_*.py'
            python3 -m unittest discover -s openqa/data -p 'test_*.py'
            python3 -m unittest discover -s openqa/report -p 'test_*.py'
            python3 -m py_compile data/*.py openqa/data/*.py openqa/production/*.py openqa/report/*.py
            prove -Iopenqa/t/lib -Iopenqa/lib openqa/t/*.t
            python3 openqa/production/check-nonvisual.py
            for script in openqa/production/*.sh data/*.sh; do bash -n "$script"; done
            shellcheck -x openqa/production/*.sh data/*.sh
            git diff --cached --check
            dbus-run-session -- xvfb-run -a /usr/bin/python3 openqa/integration/accessible_smoke.py
          } 2>&1 | tee "$RUNNER_TEMP/application-contracts-v2-validation.log"
      - name: Transfer tested immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args])
          target_tree = git('write-tree').decode().strip()
          entries = []
          for raw in git('diff', '--cached', '--name-only', '-z').split(b'\0'):
              if not raw:
                  continue
              name = raw.decode()
              index = git('ls-files', '--stage', '--', name).decode().strip()
              if not index:
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode, sha = index.split()[:2]
              request = urllib.request.Request(
                  'https://api.github.com/repos/biglinux/iso-profiles/git/blobs',
                  data=json.dumps({'content': base64.b64encode(git('show', ':' + name)).decode(), 'encoding': 'base64'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  uploaded = json.load(response)['sha']
              assert uploaded == sha
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': sha})
          result = {
              'parent': git('rev-parse', 'HEAD').decode().strip(),
              'base_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(),
              'target_tree': target_tree,
              'payload_sha256': 'a0ee83cb072e28bd05b5ab25b5c1a56ca2b46d71cc99b9c92998821757fe20be',
              'patch_sha256': 'e75c1b2bc80370e826f744029c7dd4574da46428ca4372991659f8991e006dc8',
              'entries': entries,
          }
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'application-contracts-v2-publication.json').write_text(
              json.dumps(result, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: reviewed-application-contracts-v2-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/application-contracts-v2-publication.json
            ${{ runner.temp }}/application-contracts-v2-validation.log
          retention-days: 3
          if-no-files-found: warn
