name: Apply reviewed openQA runtime v15

on:
  push:
    branches:
      - fix/openqa-nonvisual-accessibility-20260914
    paths:
      - .github/workflows/apply-openqa-runtime-v15.yml
      - openqa/.runtime-v15.patch.xz

permissions:
  contents: write

concurrency:
  group: openqa-runtime-v15-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify the reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9c66f85cd184bb213b835e1a297409013299058e"
          echo 'e967738ea0be2287a1491c15cd704f9ddafd9f932c074304fdb67f60994ff8df  openqa/.runtime-v15.patch.xz' | sha256sum --check
          xz --decompress --stdout openqa/.runtime-v15.patch.xz > "$RUNNER_TEMP/runtime-v15.patch"
          echo 'ace4d5b16df4afdede2814498306b5229119d26fed4312ba04404468dda1f389  '"$RUNNER_TEMP/runtime-v15.patch" | sha256sum --check
          git rm openqa/.runtime-v15.patch.xz .github/workflows/apply-openqa-runtime-v15.yml
          test "$(git write-tree)" = "5472ee70db268c2dd40fd21b5bcb0c051a5ac9be"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/runtime-v15.patch"
          test "$(git write-tree)" = "54945364a428887df0fbdbfe97038da9ce0294eb"

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r openqa/report/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core \
            dbus-x11 xvfb openbox xdotool shellcheck
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate the exact implementation
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          {
            python3 -m unittest discover -s data -p 'test_*.py'
            python3 -m unittest discover -s openqa/data -p 'test_*.py'
            python3 -m unittest discover -s openqa/report -p 'test_*.py'
            python3 -m py_compile data/*.py openqa/production/*.py openqa/report/*.py openqa/integration/*.py
            python3 openqa/production/check-nonvisual.py
            prove -Iopenqa/t/lib -Iopenqa/lib openqa/t/*.t
            for script in openqa/production/*.sh data/*.sh; do bash -n "$script"; done
            shellcheck -x openqa/production/*.sh data/*.sh
            "$RUNNER_TEMP/bin/actionlint" -color \
              .github/workflows/openqa*.yml \
              .github/workflows/mirror-openqa-image.yml \
              .github/workflows/validate-iso-once.yml
            git diff --cached --check
            test "$(git write-tree)" = "54945364a428887df0fbdbfe97038da9ce0294eb"
            dbus-run-session -- xvfb-run -a /usr/bin/python3 \
              openqa/integration/accessible_smoke.py
          } 2>&1 | tee "$RUNNER_TEMP/runtime-v15-validation.log"

      - name: Publish the validated implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "54945364a428887df0fbdbfe97038da9ce0294eb"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'fix(openqa): use branded Calamares anchors and directed witnesses' \
            -m 'Match the heading actually selected by each BigLinux branding profile. Stream PID-owned top-level windows and read role/name before expensive state so unrelated Qt layout objects cannot consume the page deadline.' \
            -m 'After the exact top-level appears, descendant calls return to the normal bounded AT-SPI timeout. Hidden, insensitive, ambiguous, incomplete and out-of-scope controls remain blocking; no screenshot or coordinate fallback is introduced.'
          test "$(git rev-parse HEAD^{tree})" = "54945364a428887df0fbdbfe97038da9ce0294eb"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: openqa-runtime-v15-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-v15-validation.log
          retention-days: 7
          if-no-files-found: warn
