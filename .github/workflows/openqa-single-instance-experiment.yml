---
name: openQA candidate release gate

on:
  workflow_call:
    inputs:
      candidate_artifact:
        description: Private workflow artifact containing the ISO candidate
        required: true
        type: string
      iso_filename:
        description: Exact ISO filename inside the candidate artifact
        required: true
        type: string
      version:
        description: openQA product version for this candidate
        required: true
        type: string
      build_id:
        description: Immutable build identifier shown in openQA
        required: true
        type: string
  workflow_dispatch:
    inputs:
      iso_release_tag:
        description: Existing GitHub release tag containing the last known working ISO
        required: true
        type: string
        default: biglinux_2026-07-31_k71-r7
      iso_filename:
        description: ISO filename before release splitting
        required: true
        type: string
        default: biglinux_2026-07-31_k71.iso
      version:
        description: openQA product version from scenario-definitions.yaml
        required: true
        type: string
        default: '2026.07.31'
      build_id:
        description: Immutable build identifier shown in openQA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: openqa-candidate-${{ inputs.build_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: openQA BIOS + UEFI
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ISO_FILENAME: ${{ inputs.iso_filename }}
      OPENQA_VERSION: ${{ inputs.version }}
      OPENQA_BUILD: ${{ inputs.build_id }}
      OPENQA_EXAMPLE_SHA: 274346e71b36def7decbcfd00095ccdeeb195ca8
      OPENQA_IMAGE: registry.opensuse.org/devel/openqa/containers/openqa-single-instance@sha256:2907e9f829bc0dc7c515c1e2eb17974fd8668449cc866597b67f49b1280e849f

    steps:
      - name: Check out the tested sources
        uses: actions/checkout@v6

      - name: Download the private ISO candidate
        if: ${{ inputs.candidate_artifact != '' }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.candidate_artifact }}
          path: ${{ runner.temp }}/openqa-assets

      - name: Download existing release ISO
        if: ${{ inputs.candidate_artifact == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISO_RELEASE_TAG: ${{ inputs.iso_release_tag }}
        run: |
          set -euo pipefail
          openqa_asset_dir="$RUNNER_TEMP/openqa-assets"
          mkdir -p "$openqa_asset_dir"
          gh release download "$ISO_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$openqa_asset_dir" \
            --pattern "$ISO_FILENAME.7z.*" \
            --pattern "$ISO_FILENAME.md5" \
            --pattern "$ISO_FILENAME.sha256"
          mapfile -t iso_parts < <(find "$openqa_asset_dir" -maxdepth 1 \
            -type f -name "$ISO_FILENAME.7z.*" -print | sort -V)
          test "${#iso_parts[@]}" -gt 0
          7z x "${iso_parts[0]}" -o"$openqa_asset_dir"

      - name: Verify candidate checksums
        run: |
          set -euo pipefail
          openqa_asset_dir="$RUNNER_TEMP/openqa-assets"
          test -s "$openqa_asset_dir/$ISO_FILENAME"
          (
            cd "$openqa_asset_dir"
            sha256sum --check "$ISO_FILENAME.sha256"
            md5sum --check "$ISO_FILENAME.md5"
          )

      - name: Validate helper sources
        run: |
          set -euo pipefail
          git diff --check
          cmp openqa/data/atspi_probe.py data/atspi_probe.py
          python3 -m unittest discover -s data -p 'test_*.py'
          python3 -m unittest discover -s openqa/data -p 'test_*.py'
          python3 -m unittest discover -s openqa/report -p 'test_*.py'

      - name: Inspect virtualization support
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo 'The BigLinux release gate requires KVM on the GitHub runner' >&2
            exit 1
          fi
          docker version
          stat /dev/kvm

      - name: Generate disposable openQA credentials
        run: |
          set -euo pipefail
          test_password=$(openssl rand -hex 18)
          echo "::add-mask::$test_password"
          printf 'OPENQA_TEST_PASSWORD=%s\n' "$test_password" >> "$GITHUB_ENV"

      - name: Start pinned openQA single-instance
        run: |
          set -euo pipefail
          openqa_asset_dir="$RUNNER_TEMP/openqa-assets"
          kvm_gid=$(stat --format '%g' /dev/kvm)
          docker run --detach \
            --name openqa \
            --publish 1080:80 \
            --publish 1443:443 \
            --tmpfs /srv/www/htdocs:mode=0755 \
            --tmpfs /var/log/apache2:mode=0755 \
            --volume "$openqa_asset_dir:/var/lib/openqa/share/factory/iso:ro" \
            --device /dev/kvm \
            --env "KVM_GID=$kvm_gid" \
            --entrypoint /bin/bash \
            "$OPENQA_IMAGE" \
            -c 'groupmod --gid "$KVM_GID" --non-unique kvm &&
                usermod --append --groups kvm _openqa-worker &&
                exec /usr/share/openqa/script/openqa-bootstrap'

      - name: Wait for the openQA API and worker
        run: |
          set -euo pipefail
          for attempt in {1..120}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:1080/api/v1/jobs >/dev/null \
              && docker exec openqa su _openqa-worker -c \
                'test -r /dev/kvm -a -w /dev/kvm'; then
              echo "openQA became ready after $((attempt * 5)) seconds or less"
              exit 0
            fi
            if [[ $(docker inspect --format '{{.State.Running}}' openqa) != true ]]; then
              echo 'The openQA container stopped before it became ready' >&2
              docker logs openqa
              exit 1
            fi
            sleep 5
          done
          echo 'The openQA API/worker was not ready within 10 minutes' >&2
          docker logs openqa
          exit 1

      - name: Run the official QEMU and VNC smoke test
        run: |
          set -euo pipefail
          docker exec openqa openqa-cli schedule --monitor \
            async=1 \
            SCENARIO_DEFINITIONS_YAML_FILE="https://raw.githubusercontent.com/os-autoinst/os-autoinst-distri-example/$OPENQA_EXAMPLE_SHA/scenario-definitions.yaml" \
            DISTRI=example \
            VERSION=0 \
            FLAVOR=DVD \
            ARCH=x86_64 \
            TEST=simple_boot \
            _GROUP_ID=0 \
            BUILD="smoke-${GITHUB_RUN_ID}" \
            CASEDIR="https://github.com/os-autoinst/os-autoinst-distri-example.git#$OPENQA_EXAMPLE_SHA" \
            TEST_GIT_REFSPEC="$OPENQA_EXAMPLE_SHA" \
            PRODUCTDIR=. \
            NEEDLES_DIR=%%CASEDIR%%/needles

      - name: Run mandatory BigLinux BIOS and UEFI gates
        run: |
          set -uo pipefail
          overall=0
          for test_suite in release_bios release_uefi; do
            echo "Running BigLinux openQA schedule: $test_suite"
            case "$test_suite" in
              release_bios) biglinux_schedule=release ;;
              release_uefi) biglinux_schedule=release_uefi ;;
              *) echo "Unknown BigLinux test suite: $test_suite" >&2; exit 1 ;;
            esac
            if ! docker exec openqa openqa-cli schedule --monitor \
              async=1 \
              SCENARIO_DEFINITIONS_YAML_FILE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/openqa/scenario-definitions.yaml" \
              DISTRI=biglinux \
              VERSION="$OPENQA_VERSION" \
              FLAVOR=Live \
              ARCH=x86_64 \
              TEST="$test_suite" \
              BIGLINUX_SCHEDULE="$biglinux_schedule" \
              BIGLINUX_TEST_USER=openqa \
              BIGLINUX_TEST_HOSTNAME=biglinux-openqa \
              _SECRET_BIGLINUX_TEST_PASSWORD="$OPENQA_TEST_PASSWORD" \
              BIGLINUX_RELEASE_GATE=1 \
              TIMEOUT_SCALE=1 \
              _GROUP_ID=0 \
              BUILD="$OPENQA_BUILD-$test_suite" \
              ISO="$ISO_FILENAME" \
              CASEDIR="https://github.com/${GITHUB_REPOSITORY}.git#${GITHUB_REF_NAME}" \
              TEST_GIT_REFSPEC="$GITHUB_SHA" \
              PRODUCTDIR=openqa \
              NEEDLES_DIR=%%CASEDIR%%/openqa/needles \
              SERIALDEV=hvc0; then
              echo "openQA failed for $test_suite" >&2
              overall=1
            fi
          done
          exit "$overall"

      - name: Collect openQA diagnostics
        if: ${{ always() }}
        run: |
          set +e
          mkdir -p openqa-diagnostics
          if docker inspect openqa >/dev/null 2>&1; then
            docker logs openqa >openqa-diagnostics/container.log 2>&1
            docker inspect openqa >openqa-diagnostics/container.json
            job_ids=$(curl --fail --silent --show-error \
              http://127.0.0.1:1080/api/v1/jobs \
              | jq -r --arg build "$OPENQA_BUILD-release_bios" \
                '.jobs[] | select(.settings.DISTRI == "biglinux" and .settings.BUILD == $build) | .id')
            job_ids="$job_ids"$'\n'"$(curl --fail --silent --show-error \
              http://127.0.0.1:1080/api/v1/jobs \
              | jq -r --arg build "$OPENQA_BUILD-release_uefi" \
                '.jobs[] | select(.settings.DISTRI == "biglinux" and .settings.BUILD == $build) | .id')"
            while IFS= read -r job_id; do
              [[ -n "$job_id" ]] || continue
              docker exec openqa openqa-cli archive --host http://localhost \
                "$job_id" "/tmp/biglinux-openqa-job-$job_id"
              docker cp "openqa:/tmp/biglinux-openqa-job-$job_id" \
                "openqa-diagnostics/testresults-$job_id"
            done <<<"$job_ids"
            if docker exec openqa test -d /var/lib/openqa/pool/1; then
              docker cp openqa:/var/lib/openqa/pool/1 \
                openqa-diagnostics/worker-pool
            fi
          fi

      - name: Generate the human-readable validation report
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 openqa/report/generate_report.py \
            --results-root openqa-diagnostics \
            --output openqa-diagnostics/biglinux-validation-report.html

      - name: Upload openQA diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: openqa-${{ inputs.build_id }}
          path: openqa-diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Stop openQA
        if: ${{ always() }}
        run: |
          if docker inspect openqa >/dev/null 2>&1; then
            docker stop openqa
          fi
