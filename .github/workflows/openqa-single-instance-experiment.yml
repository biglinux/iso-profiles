---
name: BigLinux openQA release gate

on:
  workflow_call:
    inputs:
      candidate_artifact:
        description: Private workflow artifact containing the ISO candidate
        required: true
        type: string
      iso_filename:
        description: Exact ISO filename inside the candidate artifact
        required: true
        type: string
      version:
        description: openQA product version for this candidate
        required: true
        type: string
      build_id:
        description: Immutable build identifier for this candidate
        required: true
        type: string
  workflow_dispatch:
    inputs:
      iso_release_tag:
        description: Existing release tag used only for manual validation
        required: false
        type: string
        default: biglinux_2026-07-31_k71-r7
      iso_filename:
        description: ISO filename before release splitting
        required: true
        type: string
        default: biglinux_2026-07-31_k71.iso
      version:
        description: openQA product version from scenario-definitions.yaml
        required: true
        type: string
        default: candidate
      build_id:
        description: Immutable build identifier for this candidate
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: openQA ${{ matrix.suite }} (local KVM)
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: bios
            firmware: bios
          - suite: uefi
            firmware: uefi
          - suite: applications-0
            firmware: bios
            application_shard_index: 0
          - suite: applications-1
            firmware: bios
            application_shard_index: 1
          - suite: applications-2
            firmware: bios
            application_shard_index: 2
          - suite: applications-3
            firmware: bios
            application_shard_index: 3
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SUITE: ${{ matrix.suite }}
      FIRMWARE: ${{ matrix.firmware }}
      APPLICATION_SHARD_INDEX: ${{ matrix.application_shard_index }}
      ISO_FILENAME: ${{ inputs.iso_filename }}
      OPENQA_VERSION: ${{ inputs.version }}
      OPENQA_BUILD: ${{ inputs.build_id }}
      OPENQA_CONTAINER: biglinux-openqa-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out the tested sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize diagnostics and validate inputs
        run: |
          set -euo pipefail
          OPENQA_DIAGNOSTICS_DIR="$RUNNER_TEMP/openqa-diagnostics/$SUITE"
          OPENQA_PASSWORD_FILE="$RUNNER_TEMP/openqa-test-password"
          OPENQA_WORKER_CONFIG="$RUNNER_TEMP/openqa-worker.ini"
          OPENQA_OVMF_RUNTIME="$RUNNER_TEMP/openqa-ovmf"
          APPLICATION_SHARD_COUNT=$(ruby -ryaml -e \
            'puts YAML.safe_load_file("openqa/development/release-gate.yaml", permitted_classes: [], aliases: false).fetch("application_shard_count")')
          [[ "$APPLICATION_SHARD_COUNT" =~ ^[1-9][0-9]*$ ]] || {
            echo 'Invalid application shard count in release-gate.yaml' >&2
            exit 2
          }
          {
            printf 'OPENQA_DIAGNOSTICS_DIR=%s\n' "$OPENQA_DIAGNOSTICS_DIR"
            printf 'OPENQA_PASSWORD_FILE=%s\n' "$OPENQA_PASSWORD_FILE"
            printf 'OPENQA_WORKER_CONFIG=%s\n' "$OPENQA_WORKER_CONFIG"
            printf 'OPENQA_OVMF_RUNTIME=%s\n' "$OPENQA_OVMF_RUNTIME"
            printf 'APPLICATION_SHARD_COUNT=%s\n' "$APPLICATION_SHARD_COUNT"
          } >>"$GITHUB_ENV"
          mkdir -p -- "$OPENQA_DIAGNOSTICS_DIR/results" "$OPENQA_OVMF_RUNTIME"
          [[ "$ISO_FILENAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.iso$ ]] || {
            echo 'Invalid ISO filename' >&2
            exit 2
          }
          [[ "$OPENQA_VERSION" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo 'Invalid openQA version' >&2
            exit 2
          }
          [[ "$OPENQA_BUILD" =~ ^[A-Za-z0-9_.:-]+$ ]] || {
            echo 'Invalid openQA build identifier' >&2
            exit 2
          }
          if [[ "$SUITE" == applications-* ]]; then
            if ! [[ "$APPLICATION_SHARD_INDEX" =~ ^[0-9]+$ ]] || \
              ! ((APPLICATION_SHARD_INDEX < APPLICATION_SHARD_COUNT)); then
              echo 'Invalid application shard index' >&2
              exit 2
            fi
          else
            [[ -z "$APPLICATION_SHARD_INDEX" ]] || {
              echo 'Firmware suite must not have an application shard' >&2
              exit 2
            }
          fi
          printf 'suite=%s\nfirmware=%s\nshard=%s/%s\nrun_id=%s\nrun_attempt=%s\ncommit=%s\n' \
            "$SUITE" "$FIRMWARE" "${APPLICATION_SHARD_INDEX:-none}" "$APPLICATION_SHARD_COUNT" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" \
            >"$OPENQA_DIAGNOSTICS_DIR/run-metadata.txt"

      - name: Validate pinned openQA image
        run: |
          set -euo pipefail
          openqa_image=$(tr -d '[:space:]' < openqa/openqa-image.txt)
          [[ "$openqa_image" =~ ^registry\.opensuse\.org/.+:[^@[:space:]]+@sha256:[[:xdigit:]]{64}$ ]] || {
            echo 'openQA image must contain a version tag and digest' >&2
            exit 2
          }
          [[ "$openqa_image" != *:latest@sha256:* ]] || {
            echo 'openQA image must not use the mutable latest tag' >&2
            exit 2
          }
          echo "OPENQA_IMAGE=$openqa_image" >>"$GITHUB_ENV"
          docker pull "$openqa_image"
          docker image inspect "$openqa_image" \
            --format 'image={{index .RepoDigests 0}} id={{.Id}}' \
            | tee "$OPENQA_DIAGNOSTICS_DIR/openqa-image.txt"
          docker run --rm --entrypoint /bin/bash "$openqa_image" -c \
            'rpm -q openQA os-autoinst openQA-client' \
            | tee "$OPENQA_DIAGNOSTICS_DIR/openqa-packages.txt"
          docker run --rm --entrypoint /bin/bash "$openqa_image" -c \
            'rpm -q --qf "openQA-client %{VERSION}-%{RELEASE}\\n" openQA-client' \
            | tee "$OPENQA_DIAGNOSTICS_DIR/openqa-cli-version.txt"

      - name: Download the private ISO candidate
        if: ${{ inputs.candidate_artifact != '' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ inputs.candidate_artifact }}
          path: ${{ runner.temp }}/openqa-assets

      - name: Download existing release ISO for manual validation
        if: ${{ inputs.candidate_artifact == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISO_RELEASE_TAG: ${{ inputs.iso_release_tag }}
        run: |
          set -euo pipefail
          openqa_asset_dir="$RUNNER_TEMP/openqa-assets"
          mkdir -p -- "$openqa_asset_dir"
          mapfile -t release_assets < <(gh release view "$ISO_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          has_asset() {
            local expected=$1 asset
            for asset in "${release_assets[@]}"; do
              [[ "$asset" == "$expected" ]] && return 0
            done
            return 1
          }
          if has_asset "$ISO_FILENAME"; then
            has_asset "$ISO_FILENAME.sha256" || { echo 'Release ISO SHA-256 asset is missing' >&2; exit 1; }
            has_asset "$ISO_FILENAME.md5" || { echo 'Release ISO MD5 asset is missing' >&2; exit 1; }
            gh release download "$ISO_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$openqa_asset_dir" \
              --pattern "$ISO_FILENAME" --pattern "$ISO_FILENAME.md5" --pattern "$ISO_FILENAME.sha256"
          else
            mapfile -t split_assets < <(printf '%s\n' "${release_assets[@]}" \
              | awk -v prefix="$ISO_FILENAME.7z." 'index($0, prefix) == 1 {print}' \
              | sort -V)
            ((${#split_assets[@]} > 0)) || { echo 'Neither a direct ISO nor split ISO parts are published' >&2; exit 1; }
            for asset in "${split_assets[@]}"; do
              [[ "$asset" =~ ^[A-Za-z0-9._-]+\.7z\.[0-9]{3}$ ]] || {
                echo "Invalid split ISO asset name: $asset" >&2
                exit 2
              }
              gh release download "$ISO_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$openqa_asset_dir" \
                --pattern "$asset"
            done
            has_asset "$ISO_FILENAME.sha256" || { echo 'Release ISO SHA-256 asset is missing' >&2; exit 1; }
            has_asset "$ISO_FILENAME.md5" || { echo 'Release ISO MD5 asset is missing' >&2; exit 1; }
            gh release download "$ISO_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$openqa_asset_dir" \
              --pattern "$ISO_FILENAME.md5" --pattern "$ISO_FILENAME.sha256"
          fi
          if [[ ! -s "$openqa_asset_dir/$ISO_FILENAME" ]]; then
            declare -A iso_parts=()
            for iso_part in "$openqa_asset_dir/$ISO_FILENAME.7z."*; do
              [[ -f "$iso_part" ]] || continue
              suffix=${iso_part##*.7z.}
              [[ "$suffix" =~ ^[0-9]{3}$ ]] || {
                echo "Invalid ISO part name: ${iso_part##*/}" >&2
                exit 2
              }
              iso_parts[$((10#$suffix))]="$iso_part"
            done
            ((${#iso_parts[@]} > 0)) || {
              echo 'Neither a direct ISO nor split ISO parts were downloaded' >&2
              exit 1
            }
            max_part=0
            for part_number in "${!iso_parts[@]}"; do
              ((part_number > max_part)) && max_part=$part_number
            done
            for ((part_number = 1; part_number <= max_part; part_number++)); do
              [[ -n "${iso_parts[$part_number]:-}" ]] || {
                echo "Missing ISO part number $part_number" >&2
                exit 1
              }
            done
            7z t "${iso_parts[1]}"
            7z x "${iso_parts[1]}" -o"$openqa_asset_dir"
            for iso_part in "${iso_parts[@]}"; do
              unlink -- "$iso_part"
            done
          fi

      - name: Verify candidate checksums
        run: |
          set -euo pipefail
          openqa_asset_dir="$RUNNER_TEMP/openqa-assets"
          test -s "$openqa_asset_dir/$ISO_FILENAME"
          (
            cd "$openqa_asset_dir"
            sha256sum --check "$ISO_FILENAME.sha256"
            md5sum --check "$ISO_FILENAME.md5"
          ) | tee "$OPENQA_DIAGNOSTICS_DIR/checksums.txt"
          sha256sum "$openqa_asset_dir/$ISO_FILENAME" | awk '{print $1}' \
            | tee "$OPENQA_DIAGNOSTICS_DIR/iso-sha256.txt"
          printf 'BIGLINUX_ISO_SHA256=%s\n' "$(<"$OPENQA_DIAGNOSTICS_DIR/iso-sha256.txt")" >>"$GITHUB_ENV"
          printf '%s\n' "$ISO_FILENAME" >"$OPENQA_DIAGNOSTICS_DIR/iso-name.txt"
          stat --printf='iso_bytes=%s\n' "$openqa_asset_dir/$ISO_FILENAME" \
            | tee "$OPENQA_DIAGNOSTICS_DIR/iso-size.txt"

      - name: Validate repository sources
        run: |
          set -euo pipefail
          git diff --check
          bash -n openqa/production/*.sh openqa/development/*.sh data/*.sh
          shellcheck -x openqa/production/*.sh openqa/development/*.sh data/*.sh
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.safe_load_file(path, permitted_classes: [], aliases: false) }' \
            .github/workflows/*.yml openqa/*.yaml openqa/development/*.yaml
          python3 -m unittest discover -s data -p 'test_*.py'
          python3 -m unittest discover -s openqa/data -p 'test_*.py'
          python3 -m unittest discover -s openqa/report -p 'test_*.py'
          python3 -m unittest discover -s openqa/production -p 'test_*.py'
          openqa/production/test_verify-kvm-results.sh
          python3 -m py_compile data/*.py openqa/data/*.py openqa/report/*.py openqa/production/*.py
          # "type_string calamares->test_user" is valid Perl that means
          # "calamares->type_string(...)": the indirect object syntax silently
          # calls the wrong method, and perl -c cannot see it. Require the
          # parentheses that settle the parse.
          if grep -rnE '^\s*(type_string|type_password|assert_script_run|script_run|record_info|upload_logs)\s+[a-z_]+->' \
            openqa/tests/*.pm openqa/lib/*.pm; then
            echo 'Call the method first and pass its result in parentheses' >&2
            exit 1
          fi
          # os-autoinst forwards a second select_console argument to
          # distribution::console_selected, whose signature takes the console
          # alone and dies on anything more. perl -c cannot see it either.
          if grep -rnE "select_console\s+'[a-z0-9-]+'\s*," openqa/tests/*.pm openqa/lib/*.pm; then
            echo 'select_console takes the console name alone' >&2
            exit 1
          fi

      - name: Install KVM validation tools
        run: |
          set -euo pipefail
          if ! command -v qemu-system-x86_64 >/dev/null 2>&1 || \
             ! command -v kvm-ok >/dev/null 2>&1 || \
             ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes cpu-checker jq qemu-system-x86
          fi
          command -v qemu-system-x86_64
          command -v kvm-ok
          command -v jq
          dpkg-query -W -f='${Package} ${Version}\n' qemu-system-x86 cpu-checker \
            | tee "$OPENQA_DIAGNOSTICS_DIR/host-packages.txt"

      - name: Prepare deterministic non-Secure-Boot UEFI firmware
        if: ${{ matrix.firmware == 'uefi' }}
        run: |
          set -euo pipefail
          if ! dpkg-query -W -f='${Status}' ovmf 2>/dev/null | grep -q 'install ok installed'; then
            sudo apt-get update
            sudo apt-get install --yes ovmf
          fi

          ovmf_code=
          ovmf_vars=
          for pair in \
            /usr/share/OVMF/OVMF_CODE_4M.fd:/usr/share/OVMF/OVMF_VARS_4M.fd \
            /usr/share/OVMF/OVMF_CODE.fd:/usr/share/OVMF/OVMF_VARS.fd; do
            candidate_code=${pair%%:*}
            candidate_vars=${pair#*:}
            if [[ -s "$candidate_code" && -s "$candidate_vars" ]]; then
              ovmf_code=$candidate_code
              ovmf_vars=$candidate_vars
              break
            fi
          done
          [[ -n "$ovmf_code" && -n "$ovmf_vars" ]] || {
            echo 'A matching non-Secure-Boot OVMF code/vars pair was not found' >&2
            find /usr/share/OVMF -maxdepth 1 -type f -printf '%f\n' >&2 || true
            exit 1
          }

          cp -- "$ovmf_code" "$OPENQA_OVMF_RUNTIME/OVMF_CODE.fd"
          cp -- "$ovmf_vars" "$OPENQA_OVMF_RUNTIME/OVMF_VARS.fd"
          chmod 0444 -- "$OPENQA_OVMF_RUNTIME/OVMF_CODE.fd"
          chmod 0644 -- "$OPENQA_OVMF_RUNTIME/OVMF_VARS.fd"
          dpkg-query -W -f='${Package} ${Version}\n' ovmf \
            | tee "$OPENQA_DIAGNOSTICS_DIR/ovmf-package.txt"
          printf 'host_code=%s\nhost_vars=%s\n' "$ovmf_code" "$ovmf_vars" \
            | tee "$OPENQA_DIAGNOSTICS_DIR/ovmf.txt"

      - name: Validate KVM access before openQA
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo '::error::/dev/kvm is not available on this GitHub-hosted runner'
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm
          stat --printf='path=%n mode=%a uid=%u gid=%g\n' /dev/kvm \
            | tee "$OPENQA_DIAGNOSTICS_DIR/kvm-device.txt"
          kvm-ok | tee "$OPENQA_DIAGNOSTICS_DIR/kvm-ok.txt"
          free -h | tee "$OPENQA_DIAGNOSTICS_DIR/resources-before.txt"
          df -h | tee "$OPENQA_DIAGNOSTICS_DIR/disk-before.txt"
          nproc | tee "$OPENQA_DIAGNOSTICS_DIR/cpu-count.txt"
          qemu_pidfile="$OPENQA_DIAGNOSTICS_DIR/qemu-kvm-smoke.pid"
          qemu_log="$OPENQA_DIAGNOSTICS_DIR/qemu-kvm-smoke.log"
          rm -f -- "$qemu_pidfile"
          qemu-system-x86_64 \
            -accel kvm \
            -machine q35 \
            -nodefaults \
            -display none \
            -monitor none \
            -S \
            -daemonize \
            -pidfile "$qemu_pidfile" \
            >"$qemu_log" 2>&1
          test -s "$qemu_pidfile"
          qemu_pid=$(<"$qemu_pidfile")
          kill "$qemu_pid"
          printf 'QEMU KVM smoke test passed with PID %s\n' "$qemu_pid" | tee -a "$qemu_log"

      - name: Prepare local worker and test password
        run: |
          set -euo pipefail
          umask 077
          openssl rand -hex 18 | tr -d '\n' >"$OPENQA_PASSWORD_FILE"
          test_password=$(<"$OPENQA_PASSWORD_FILE")
          echo "::add-mask::$test_password"
          printf '[global]\nHOST = http://localhost\nBACKEND = qemu\nWORKER_CLASS = biglinux-kvm\n' \
            >"$OPENQA_WORKER_CONFIG"
          chmod 0644 "$OPENQA_WORKER_CONFIG"

      - name: Start ephemeral local openQA and worker
        run: |
          set -euo pipefail
          openqa_asset_dir="$RUNNER_TEMP/openqa-assets"
          mkdir -p -- "$OPENQA_DIAGNOSTICS_DIR/results"
          docker_args=(
            --detach
            --name "$OPENQA_CONTAINER"
            --publish 127.0.0.1:1080:80
            --tmpfs /srv/www/htdocs:mode=0755
            --tmpfs /var/log/apache2:mode=0755
            --volume "$GITHUB_WORKSPACE:/workspace-source:ro"
            --volume "$openqa_asset_dir:/var/lib/openqa/share/factory/iso:ro"
            --volume "$OPENQA_DIAGNOSTICS_DIR/results:/var/lib/openqa/biglinux-results:rw"
            --volume "$OPENQA_PASSWORD_FILE:/run/secrets/biglinux-test-password:ro"
            --volume "$OPENQA_WORKER_CONFIG:/etc/openqa/workers.ini.d/99-biglinux.ini:ro"
            --volume "$OPENQA_OVMF_RUNTIME:/run/ovmf:rw"
            --device /dev/kvm
            --env "KVM_GID=$(stat --format '%g' /dev/kvm)"
            --env OPENQA_MCP_ENABLED=0
            --entrypoint /bin/bash
          )
          docker run "${docker_args[@]}" "$OPENQA_IMAGE" \
            /workspace-source/openqa/development/start-container.sh
          docker inspect "$OPENQA_CONTAINER" >"$OPENQA_DIAGNOSTICS_DIR/container-start.json"

      - name: Wait for local API scheduler and worker
        run: |
          set -euo pipefail
          for attempt in {1..180}; do
            api_ready=0
            worker_ready=0
            scheduler_ready=0
            if curl --fail --silent --show-error \
              http://127.0.0.1:1080/api/v1/jobs >"$OPENQA_DIAGNOSTICS_DIR/jobs-ready.json"; then
              api_ready=1
            fi
            if curl --fail --silent --show-error \
              http://127.0.0.1:1080/api/v1/workers >"$OPENQA_DIAGNOSTICS_DIR/workers.json" && \
              jq -e '[.workers[]? | select(.status == "idle" or .status == "running") | select((.properties.WORKER_CLASS // "") | contains("biglinux-kvm"))] | length == 1' \
                "$OPENQA_DIAGNOSTICS_DIR/workers.json" >/dev/null && \
              docker exec "$OPENQA_CONTAINER" su _openqa-worker -c \
                'test -r /dev/kvm -a -w /dev/kvm'; then
              worker_ready=1
            fi
            if docker exec "$OPENQA_CONTAINER" pgrep -f openqa-scheduler-daemon >/dev/null 2>&1; then
              scheduler_ready=1
            fi
            if ((api_ready && worker_ready && scheduler_ready)); then
              echo "Local openQA became ready after $((attempt * 5)) seconds or less"
              docker exec "$OPENQA_CONTAINER" qemu-system-x86_64 --version \
                | tee "$OPENQA_DIAGNOSTICS_DIR/container-qemu-version.txt"
              docker exec "$OPENQA_CONTAINER" find /usr/share -type f \( \
                -iname 'OVMF_CODE*.fd' -o -iname 'OVMF_VARS*.fd' \) \
                | tee "$OPENQA_DIAGNOSTICS_DIR/container-ovmf.txt"
              exit 0
            fi
            if container_state=$(docker inspect --format '{{.State.Running}}' "$OPENQA_CONTAINER" 2>/dev/null); then
              :
            else
              container_state=missing
            fi
            if [[ "$container_state" != true ]]; then
              echo 'The local openQA container stopped before becoming ready' >&2
              if ! docker logs "$OPENQA_CONTAINER" >&2; then
                echo 'Container logs were unavailable' >&2
              fi
              exit 1
            fi
            if ((attempt == 180)); then
              echo 'The local openQA API, scheduler, and worker were not ready within 15 minutes' >&2
              if ! docker logs "$OPENQA_CONTAINER" >&2; then
                echo 'Container logs were unavailable' >&2
              fi
              exit 1
            fi
            sleep 5
          done

      - name: Schedule and monitor one mandatory plan
        run: |
          set -euo pipefail
          export BIGLINUX_OPENQA_CONTAINER="$OPENQA_CONTAINER"
          export BIGLINUX_OPENQA_FIRMWARE="$FIRMWARE"
          export BIGLINUX_OPENQA_VERSION="$OPENQA_VERSION"
          export BIGLINUX_OPENQA_BUILD="$OPENQA_BUILD"
          export BIGLINUX_ISO_FILENAME="$ISO_FILENAME"
          export BIGLINUX_TEST_USER=openqa
          export BIGLINUX_TEST_PASSWORD_FILE="$OPENQA_PASSWORD_FILE"
          export BIGLINUX_TEST_PASSWORD_CONTAINER_FILE=/run/secrets/biglinux-test-password
          export BIGLINUX_OPENQA_CASEDIR=/workspace
          export BIGLINUX_OPENQA_SCENARIO_DEFINITIONS=/workspace/openqa/scenario-definitions.yaml
          export BIGLINUX_OPENQA_TEST_GIT_REFSPEC="$GITHUB_SHA"
          export BIGLINUX_OPENQA_UEFI_PFLASH_CODE=/run/ovmf/OVMF_CODE.fd
          export BIGLINUX_OPENQA_UEFI_PFLASH_VARS=/run/ovmf/OVMF_VARS.fd
          export BIGLINUX_OPENQA_PRODUCTDIR=openqa
          export BIGLINUX_OPENQA_DIAGNOSTICS_DIR="$OPENQA_DIAGNOSTICS_DIR"
          export BIGLINUX_ISO_SHA256
          if [[ "$SUITE" == applications-* ]]; then
            BIGLINUX_OPENQA_FIRMWARE='' ./openqa/development/schedule-release-gate.sh \
              --applications-shard "$APPLICATION_SHARD_INDEX" "$APPLICATION_SHARD_COUNT"
          else
            ./openqa/development/schedule-release-gate.sh --firmware "$FIRMWARE"
          fi

      - name: Collect openQA diagnostics
        if: ${{ always() }}
        run: |
          set +e
          collection_status=0
          mkdir -p -- "$OPENQA_DIAGNOSTICS_DIR/results"
          free -h >"$OPENQA_DIAGNOSTICS_DIR/resources-before-collection.txt"
          df -h >"$OPENQA_DIAGNOSTICS_DIR/disk-before-collection.txt"
          if docker inspect "$OPENQA_CONTAINER" >/dev/null 2>&1; then
            docker logs "$OPENQA_CONTAINER" >"$OPENQA_DIAGNOSTICS_DIR/container.log" 2>&1 || collection_status=1
            docker inspect "$OPENQA_CONTAINER" >"$OPENQA_DIAGNOSTICS_DIR/container.json" || collection_status=1
            job_ids_file="$OPENQA_DIAGNOSTICS_DIR/job-ids.txt"
            if [[ -s "$job_ids_file" ]]; then
              while IFS= read -r job_id; do
                [[ "$job_id" =~ ^[1-9][0-9]*$ ]] || { collection_status=1; continue; }
                if ! openqa/production/copy-job-results.sh \
                  "$OPENQA_CONTAINER" "$job_id" \
                  "$OPENQA_DIAGNOSTICS_DIR/results/$job_id" \
                  >"$OPENQA_DIAGNOSTICS_DIR/archive-$job_id.log" 2>&1; then
                  echo "Failed to copy openQA job $job_id results" >&2
                  collection_status=1
                fi
                docker exec "$OPENQA_CONTAINER" openqa-cli api --host http://localhost \
                  "jobs/$job_id" >"$OPENQA_DIAGNOSTICS_DIR/job-$job_id-api.json" 2>&1 \
                  || collection_status=1
              done <"$job_ids_file"
            fi
            if docker exec "$OPENQA_CONTAINER" test -d /var/log/openqa; then
              docker cp "$OPENQA_CONTAINER:/var/log/openqa" \
                "$OPENQA_DIAGNOSTICS_DIR/worker-logs" || collection_status=1
            fi
          else
            echo 'openQA container was never created' >"$OPENQA_DIAGNOSTICS_DIR/container.log"
          fi
          free -h >"$OPENQA_DIAGNOSTICS_DIR/resources-after.txt"
          df -h >"$OPENQA_DIAGNOSTICS_DIR/disk-after.txt"
          docker system df >"$OPENQA_DIAGNOSTICS_DIR/docker-disk-after.txt" 2>&1 || collection_status=1
          sudo chown -R "$(id -u):$(id -g)" "$OPENQA_DIAGNOSTICS_DIR" \
            || collection_status=1
          if ! BIGLINUX_OPENQA_RESULTS_DIR="$OPENQA_DIAGNOSTICS_DIR/results" \
              openqa/production/verify-archive-screenshots.sh; then
            collection_status=1
          fi
          exit "$collection_status"

      - name: Verify archived QEMU KVM evidence
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -s "$OPENQA_DIAGNOSTICS_DIR/job-ids.txt" ]]; then
            BIGLINUX_OPENQA_RESULTS_DIR="$OPENQA_DIAGNOSTICS_DIR/results" \
              BIGLINUX_OPENQA_JOB_IDS_FILE="$OPENQA_DIAGNOSTICS_DIR/job-ids.txt" \
              openqa/production/verify-kvm-results.sh
          else
            echo 'No job ID was available; the scheduling step already failed.' \
              | tee "$OPENQA_DIAGNOSTICS_DIR/kvm-verification-skipped.txt"
          fi

      - name: Redact generated test password from text diagnostics
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ ! -r "$OPENQA_PASSWORD_FILE" ]]; then
            echo 'Test password was not created because an earlier step failed.'
            exit 0
          fi
          test_password=$(<"$OPENQA_PASSWORD_FILE")
          if [[ -n "$test_password" ]]; then
            while IFS= read -r diagnostic; do
              SECRET_TO_REDACT="$test_password" perl -0pi -e \
                's/\Q$ENV{SECRET_TO_REDACT}\E/[REDACTED]/g' "$diagnostic"
            done < <(find "$OPENQA_DIAGNOSTICS_DIR" -type f \( \
              -name '*.log' -o -name '*.txt' -o -name '*.json' -o -name '*.html' \
            \) -print)
          fi

      - name: Generate human-readable validation report
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 openqa/report/generate_report.py \
            --results-root "$OPENQA_DIAGNOSTICS_DIR" \
            --output "$OPENQA_DIAGNOSTICS_DIR/biglinux-validation-report.html" \
            --markdown-output "$OPENQA_DIAGNOSTICS_DIR/RESULTADO.md"

      - name: Publish local job information in the Actions summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          # The verdict belongs on the run page. A report inside a zip is only
          # opened by someone who already suspects something is wrong.
          {
            echo "## openQA $SUITE"
            echo
            echo "ISO: \`$ISO_FILENAME\` — commit \`${GITHUB_SHA:0:7}\`"
            if [[ -s "$OPENQA_DIAGNOSTICS_DIR/RESULTADO.md" ]]; then
              echo
              sed 's/^## Resultado$//' "$OPENQA_DIAGNOSTICS_DIR/RESULTADO.md"
            else
              echo
              echo 'O openQA não produziu resultado; ver os diagnósticos no artefato.'
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Arrange the artifact around what a person opens first
        if: ${{ always() }}
        run: |
          set -euo pipefail
          cd "$OPENQA_DIAGNOSTICS_DIR"
          # Thirty-seven files sat beside the report, nearly all of them about
          # the runner rather than the ISO. Keep the three entry points at the
          # top and move the machine's own paperwork one level down.
          mkdir -p diagnostics
          for entry in *; do
            case "$entry" in
              results | diagnostics | RESULTADO.md | biglinux-validation-report.html)
                continue
                ;;
            esac
            mv -- "$entry" diagnostics/
          done

      - name: Upload openQA diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openqa-${{ matrix.suite }}-${{ inputs.build_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openqa-diagnostics/${{ matrix.suite }}/
          if-no-files-found: error
          retention-days: 14

      - name: Stop ephemeral openQA
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if docker inspect "$OPENQA_CONTAINER" >/dev/null 2>&1; then
            docker stop --timeout 30 "$OPENQA_CONTAINER"
            docker rm "$OPENQA_CONTAINER"
          fi

  applications-aggregate:
    name: Aggregate application coverage
    if: ${{ always() }}
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tested sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download application shard diagnostics
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          # Pin the pattern to this run attempt: artifacts persist across
          # re-run attempts and a bare openqa-applications-* would also match
          # stale shard results and the summary from a previous attempt.
          pattern: openqa-applications-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openqa-application-artifacts
          merge-multiple: false

      - name: Prepare application policy
        if: ${{ always() }}
        run: |
          set -euo pipefail
          ruby -rjson -ryaml -e '
            def canonical(value)
              case value
              when Hash then value.keys.sort.each_with_object({}) { |key, result| result[key] = canonical(value[key]) }
              when Array then value.map { |item| canonical(item) }
              else value
              end
            end
            puts JSON.generate(canonical(YAML.safe_load_file("openqa/application-policy.yaml", permitted_classes: [], aliases: false)))
          ' \
            >"$RUNNER_TEMP/application-policy.json"

      - name: Aggregate and validate the four application shards
        if: ${{ always() }}
        run: |
          set -euo pipefail
          application_shard_count=$(ruby -ryaml -e \
            'puts YAML.safe_load_file("openqa/development/release-gate.yaml", permitted_classes: [], aliases: false).fetch("application_shard_count")')
          python3 openqa/production/aggregate-application-results.py \
            --artifacts-root "$RUNNER_TEMP/openqa-application-artifacts" \
            --policy-json "$RUNNER_TEMP/application-policy.json" \
            --output-dir "$RUNNER_TEMP/application-summary" \
            --expected-shards "$application_shard_count"

      - name: Upload application coverage summary
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openqa-applications-summary-${{ inputs.build_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/application-summary/
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Validation report (PDF)
    if: ${{ always() }}
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tested sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download every suite's diagnostics
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          # Same attempt only: artifacts persist across re-runs and a stale suite
          # would be reported as this run's evidence.
          pattern: openqa-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openqa-artifacts

      - name: Build the report
        run: |
          set -euo pipefail
          # fpdf2 is pure Python, so this needs no system libraries and cannot
          # make the report depend on a browser being present on the runner.
          python3 -m pip install --quiet --disable-pip-version-check fpdf2 pillow
          # The repository check skips these where the libraries are absent, so
          # this is the one place they actually run.
          python3 -m unittest discover -s openqa/report -p 'test_build_pdf_report.py'
          python3 openqa/report/build_pdf_report.py \
            --artifacts-root "$RUNNER_TEMP/openqa-artifacts" \
            --output "$RUNNER_TEMP/report/biglinux-iso-validation.pdf"
          ls -la "$RUNNER_TEMP/report"

      - name: Upload the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: biglinux-iso-validation-${{ inputs.build_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report/
          if-no-files-found: error
          retention-days: 14

  openqa-release-gate:
    name: openQA release gate
    if: ${{ always() }}
    needs: [validate, applications-aggregate]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every mandatory openQA suite
        run: |
          set -euo pipefail
          validate_result='${{ needs.validate.result }}'
          aggregate_result='${{ needs.applications-aggregate.result }}'
          printf 'validate=%s\napplications-aggregate=%s\n' "$validate_result" "$aggregate_result"
          [[ "$validate_result" == success && "$aggregate_result" == success ]] || {
            echo 'Mandatory openQA firmware or application coverage did not pass.' >&2
            exit 1
          }
