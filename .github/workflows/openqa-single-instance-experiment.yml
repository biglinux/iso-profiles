---
name: openQA single-instance experiment

# Proves that a GitHub-hosted runner can start the complete openQA stack and
# boot a released BigLinux ISO through QEMU/VNC.
on:
  push:
    branches: [openqa-single-instance-experiment]
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: Open an interactive tmate session after openQA is ready
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the test and report sources
        uses: actions/checkout@v6

      - name: Inspect virtualization support
        run: |
          set -euo pipefail
          uname -a
          docker version
          if [[ -c /dev/kvm ]]; then
            echo "KVM is available"
            ls -l /dev/kvm
          else
            echo "KVM is unavailable; the test will use QEMU emulation"
          fi

      - name: Download and verify the released BigLinux ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo install -d -o "$USER" -g "$USER" /mnt/openqa-assets
          gh release download biglinux_2026-07-31_k71-r7 \
            --repo biglinux/iso-profiles \
            --dir /mnt/openqa-assets \
            --pattern '*.7z.*' \
            --pattern '*.sha256'
          iso_parts=(/mnt/openqa-assets/*.7z.*)
          if (( ${#iso_parts[@]} != 3 )); then
            echo "Expected three ISO archive parts, found ${#iso_parts[@]}" >&2
            exit 1
          fi
          7z x "${iso_parts[0]}" -o/mnt/openqa-assets
          (
            cd /mnt/openqa-assets
            sha256sum --check biglinux_2026-07-31_k71.iso.sha256
          )
          rm -- "${iso_parts[@]}"

      - name: Start openQA single-instance
        run: |
          set -euo pipefail
          container_command=()
          container_args=(
            --detach
            --name openqa
            --publish 1080:80
            --publish 1443:443
            --tmpfs /srv/www/htdocs:mode=0755
            --tmpfs /var/log/apache2:mode=0755
            --volume /mnt/openqa-assets:/var/lib/openqa/share/factory/iso
          )
          if [[ -c /dev/kvm ]]; then
            container_args+=(
              --device /dev/kvm
              --env "KVM_GID=$(stat --format '%g' /dev/kvm)"
              --entrypoint /bin/bash
            )
            container_command=(
              -c
              "groupmod --gid \"\$KVM_GID\" --non-unique kvm &&
               usermod --append --groups kvm _openqa-worker &&
               exec /usr/share/openqa/script/openqa-bootstrap"
            )
          fi
          docker run "${container_args[@]}" \
            registry.opensuse.org/devel/openqa/containers/openqa-single-instance \
            "${container_command[@]}"

      - name: Wait for the openQA API
        run: |
          set -euo pipefail
          for attempt in {1..120}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:1080/api/v1/jobs > /dev/null; then
              echo "openQA became ready after $((attempt * 5)) seconds or less"
              exit 0
            fi
            if [[ $(docker inspect --format '{{.State.Running}}' openqa) != true ]]; then
              echo "The openQA container stopped before its API became ready" >&2
              docker logs openqa
              exit 1
            fi
            sleep 5
          done
          echo "The openQA API was not ready within 10 minutes" >&2
          docker logs openqa
          exit 1

      - name: Verify KVM access from the openQA worker
        run: |
          if [[ -c /dev/kvm ]]; then
            docker exec openqa su _openqa-worker -c 'test -r /dev/kvm'
          else
            echo "KVM is unavailable on this runner"
          fi

      - name: Open a tmate debug session
        id: tmate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3
        with:
          detached: true
          limit-access-to-actor: true

      - name: Store the restricted tmate SSH command
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        env:
          TMATE_SSH_COMMAND: ${{ steps.tmate.outputs.ssh-command }}
        run: |
          if [[ "$TMATE_SSH_COMMAND" != ssh\ * || "$TMATE_SSH_COMMAND" == *$'\n'* ]]; then
            echo "The tmate action returned an invalid SSH command" >&2
            exit 1
          fi
          install --directory --mode 0700 "$RUNNER_TEMP/tmate-connection"
          printf '%s\n' "$TMATE_SSH_COMMAND" \
            > "$RUNNER_TEMP/tmate-connection/ssh-command"

      - name: Upload the restricted tmate SSH command
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        uses: actions/upload-artifact@v7
        with:
          name: tmate-ssh-${{ github.run_id }}
          path: ${{ runner.temp }}/tmate-connection/ssh-command
          if-no-files-found: error
          retention-days: 1

      - name: Wait for tmate debugging to finish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        timeout-minutes: 30
        run: |
          echo "Create /continue on the runner to start the automated tests"
          while [[ ! -e /continue && ! -e "$GITHUB_WORKSPACE/continue" ]]; do
            if [[ ! -S /tmp/tmate.sock ]]; then
              echo "The tmate session ended without a continue file" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Run the official QEMU and VNC smoke test
        run: |
          set -euo pipefail
          test_settings=()
          if [[ ! -c /dev/kvm ]]; then
            test_settings+=(QEMU_NO_KVM=1)
          fi
          docker exec openqa openqa-cli schedule --monitor \
            async=1 \
            SCENARIO_DEFINITIONS_YAML_FILE=https://raw.githubusercontent.com/os-autoinst/os-autoinst-distri-example/refs/heads/main/scenario-definitions.yaml \
            DISTRI=example \
            VERSION=0 \
            FLAVOR=DVD \
            ARCH=x86_64 \
            TEST=simple_boot \
            _GROUP_ID=0 \
            BUILD="github-actions-${GITHUB_RUN_ID}" \
            CASEDIR=https://github.com/os-autoinst/os-autoinst-distri-example.git \
            PRODUCTDIR=. \
            NEEDLES_DIR=%%CASEDIR%%/needles \
            "${test_settings[@]}"

      - name: Boot the released BigLinux ISO
        run: |
          set -euo pipefail
          test_settings=()
          if [[ ! -c /dev/kvm ]]; then
            test_settings+=(QEMU_NO_KVM=1)
          fi
          docker exec openqa openqa-cli schedule --monitor \
            async=1 \
            SCENARIO_DEFINITIONS_YAML_FILE="https://raw.githubusercontent.com/biglinux/iso-profiles/${GITHUB_SHA}/openqa/scenario-definitions.yaml" \
            DISTRI=biglinux \
            VERSION=2026.07.31 \
            FLAVOR=Live \
            ARCH=x86_64 \
            TEST=boot_menu \
            _GROUP_ID=0 \
            BUILD="github-actions-${GITHUB_RUN_ID}" \
            ISO=biglinux_2026-07-31_k71.iso \
            CASEDIR=https://github.com/biglinux/iso-profiles.git#openqa-single-instance-experiment \
            TEST_GIT_REFSPEC="${GITHUB_SHA}" \
            PRODUCTDIR=openqa \
            NEEDLES_DIR=%%CASEDIR%%/openqa/needles \
            SERIALDEV=hvc0 \
            "${test_settings[@]}"

      - name: Collect openQA diagnostics
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p openqa-diagnostics
          if docker inspect openqa > /dev/null 2>&1; then
            docker logs openqa > openqa-diagnostics/container.log 2>&1
            docker inspect openqa > openqa-diagnostics/container.json
            job_id=$(curl --fail --silent --show-error \
              http://127.0.0.1:1080/api/v1/jobs \
              | jq -r '[.jobs[] | select(.settings.DISTRI == "biglinux")] | max_by(.id).id // empty')
            if [[ -n "$job_id" ]]; then
              docker exec openqa openqa-cli archive \
                --host http://localhost \
                "$job_id" /tmp/biglinux-openqa-job
              docker cp openqa:/tmp/biglinux-openqa-job \
                openqa-diagnostics/testresults
            fi
            if docker exec openqa test -d /var/lib/openqa/pool/1; then
              docker cp openqa:/var/lib/openqa/pool/1 openqa-diagnostics/worker-pool
            fi
          fi

      - name: Generate the human-readable validation report
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 openqa/report/generate_report.py \
            --results-root openqa-diagnostics \
            --output openqa-diagnostics/biglinux-validation-report.html

      - name: Upload openQA diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: openqa-single-instance-${{ github.run_id }}
          path: openqa-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop openQA
        if: ${{ always() }}
        run: |
          if docker inspect openqa > /dev/null 2>&1; then
            docker stop openqa
          fi
