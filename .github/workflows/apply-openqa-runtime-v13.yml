name: Apply reviewed openQA runtime v13

on:
  push:
    branches:
      - fix/openqa-nonvisual-accessibility-20260914
    paths:
      - .github/workflows/apply-openqa-runtime-v13.yml
      - openqa/.runtime-v13.patch.b64.part00
      - openqa/.runtime-v13.patch.b64.part01
      - openqa/.runtime-v13.patch.b64.part02
      - openqa/.runtime-v13.patch.b64.part03

permissions:
  contents: write

concurrency:
  group: openqa-runtime-v13-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify the reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~5)" = "ffc1821d4882f4cf3da98cf6b26ebdaad27a6373"

          echo '0bfe3d64feffd20423a0605bc40e88ab02d8b4f63241e08359ac1b02a3906c44  openqa/.runtime-v13.patch.b64.part00' | sha256sum --check
          echo 'b317f27372d5efd067379910e4142884551ee460936715683465c194de7d2ef5  openqa/.runtime-v13.patch.b64.part01' | sha256sum --check
          echo '7737cf4043edfa986fddad4679da799e17f932c39073cdb3fbdda41ec32de9c4  openqa/.runtime-v13.patch.b64.part02' | sha256sum --check
          echo 'cedd69c91a9f50235a5058be3257365004094331c56ea67f78ebe47097ba99cd  openqa/.runtime-v13.patch.b64.part03' | sha256sum --check

          cat openqa/.runtime-v13.patch.b64.part{00,01,02,03} > "$RUNNER_TEMP/runtime-v13.patch.b64"
          echo '533635e699b1a22f7f65f9c80de149970c748b233423407bc0edc9031fc9ae94  '"$RUNNER_TEMP/runtime-v13.patch.b64" | sha256sum --check
          base64 --decode "$RUNNER_TEMP/runtime-v13.patch.b64" > "$RUNNER_TEMP/runtime-v13.patch.xz"
          echo 'bed284e70f76ab0649874c43cabb9fbff9c62b4295890296c77ea7cc4e7cf8cb  '"$RUNNER_TEMP/runtime-v13.patch.xz" | sha256sum --check
          xz --decompress --stdout "$RUNNER_TEMP/runtime-v13.patch.xz" > "$RUNNER_TEMP/runtime-v13.patch"
          echo 'f6c77c9eed694d0fe9edfd94ef149349db305096ea0c18ba6d7187242d1a3b6a  '"$RUNNER_TEMP/runtime-v13.patch" | sha256sum --check

          git rm \
            openqa/.runtime-v13.patch.b64.part00 \
            openqa/.runtime-v13.patch.b64.part01 \
            openqa/.runtime-v13.patch.b64.part02 \
            openqa/.runtime-v13.patch.b64.part03 \
            .github/workflows/apply-openqa-runtime-v13.yml
          test "$(git write-tree)" = "bd9b578bafff27b35157ce39c176bccf5751fec0"

          git apply --index --whitespace=error-all "$RUNNER_TEMP/runtime-v13.patch"
          test "$(git write-tree)" = "8d6ca3402f6e1c2a85d357b5cbb55ea86e377f97"

          mapfile -t changed < <(git diff --cached --name-only)
          diff -u \
            <(printf '%s\n' \
              data/atspi_probe.py \
              data/process_handoff.py \
              data/test_application_policy.py \
              data/test_application_smoke.py \
              data/test_process_handoff.py \
              docs/openqa-runtime-validation.md \
              openqa/README.md \
              openqa/application-policy.yaml \
              openqa/data/test_atspi_probe.py \
              openqa/integration/accessible_smoke.py \
              openqa/lib/application_smoke.pm \
              openqa/lib/atspi.pm \
              openqa/lib/calamares.pm \
              openqa/t/application_smoke.t \
              openqa/t/installer_scope.t \
              openqa/t/persistent_smoke.t \
              openqa/t/process_handoff.t \
              openqa/tests/installer_launch.pm) \
            <(printf '%s\n' "${changed[@]}")

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r openqa/report/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core \
            dbus-x11 xvfb openbox xdotool shellcheck
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate the exact implementation
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          {
            python3 -m unittest discover -s data -p 'test_*.py'
            python3 -m unittest discover -s openqa/data -p 'test_*.py'
            python3 -m unittest discover -s openqa/report -p 'test_*.py'
            python3 -m py_compile \
              data/*.py openqa/production/*.py openqa/report/*.py openqa/integration/*.py
            python3 openqa/production/check-nonvisual.py
            prove -Iopenqa/t/lib -Iopenqa/lib openqa/t/*.t
            for script in openqa/production/*.sh data/*.sh; do bash -n "$script"; done
            shellcheck -x openqa/production/*.sh data/*.sh
            "$RUNNER_TEMP/bin/actionlint" -color \
              .github/workflows/openqa*.yml \
              .github/workflows/mirror-openqa-image.yml \
              .github/workflows/validate-iso-once.yml
            git diff --cached --check
            test "$(git write-tree)" = "8d6ca3402f6e1c2a85d357b5cbb55ea86e377f97"
            dbus-run-session -- xvfb-run -a /usr/bin/python3 \
              openqa/integration/accessible_smoke.py
          } 2>&1 | tee "$RUNNER_TEMP/runtime-v13-validation.log"

      - name: Publish the validated implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "8d6ca3402f6e1c2a85d357b5cbb55ea86e377f97"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'fix(openqa): retain exact AT-SPI providers through application smoke' \
            -m 'Keep one PID-scoped AT-SPI client from exact window discovery through accessible-content and close observation, with an explicit READY boundary before the single keyboard request.' \
            -m 'Resolve the privileged GTK-to-Qt Calamares handoff by exact executable path, root UID and a unique startup token already forwarded by the ISO wrapper. Steam remains excluded; crashes, inaccessible windows, incomplete reads and unproven closure remain blocking.'
          test "$(git rev-parse HEAD^{tree})" = "8d6ca3402f6e1c2a85d357b5cbb55ea86e377f97"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: openqa-runtime-v13-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-v13-validation.log
          retention-days: 7
          if-no-files-found: warn
