name: Apply reviewed openQA runtime v14

on:
  push:
    branches:
      - fix/openqa-nonvisual-accessibility-20260914
    paths:
      - .github/workflows/apply-openqa-runtime-v14.yml
      - openqa/.runtime-v14.patch.xz.b64

permissions:
  contents: write

concurrency:
  group: openqa-runtime-v14-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify the reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "30505b1eee1258a53913dfeb93aff8450e5b4c50"
          echo '855a124b2ce5b01050b296d8646fd0e5ba2af7335168b7994397ec4cbae05e5a  openqa/.runtime-v14.patch.xz.b64' | sha256sum --check
          base64 --decode openqa/.runtime-v14.patch.xz.b64 > "$RUNNER_TEMP/runtime-v14.patch.xz"
          echo '7aaf18059ba401235cfe3dde020ab062401494cef038c615649eef1c8aafae8f  '"$RUNNER_TEMP/runtime-v14.patch.xz" | sha256sum --check
          xz --decompress --stdout "$RUNNER_TEMP/runtime-v14.patch.xz" > "$RUNNER_TEMP/runtime-v14.patch"
          echo '25e23e5e134b9d1e4c6ba2b406b713b1535395e977fbaaee5f16dbf82e447f68  '"$RUNNER_TEMP/runtime-v14.patch" | sha256sum --check

          git rm openqa/.runtime-v14.patch.xz.b64 .github/workflows/apply-openqa-runtime-v14.yml
          test "$(git write-tree)" = "79350345cf41323cc5dc4332fc968c2b83eb0c6c"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/runtime-v14.patch"
          test "$(git write-tree)" = "15be0b4fccbab1804acea2605d92614798f49d42"

          mapfile -t changed < <(git diff --cached --name-only HEAD^^)
          diff -u \
            <(printf '%s\n' \
              data/atspi_probe.py \
              data/test_atspi_probe.py \
              data/test_readiness_waits.py \
              docs/openqa-runtime-validation.md \
              openqa/lib/atspi.pm \
              openqa/lib/calamares.pm \
              openqa/t/atspi_contracts.t \
              openqa/t/installer_scope.t) \
            <(printf '%s\n' "${changed[@]}")

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r openqa/report/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core \
            dbus-x11 xvfb openbox xdotool shellcheck
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate the exact implementation
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          {
            python3 -m unittest discover -s data -p 'test_*.py'
            python3 -m unittest discover -s openqa/data -p 'test_*.py'
            python3 -m unittest discover -s openqa/report -p 'test_*.py'
            python3 -m py_compile \
              data/*.py openqa/production/*.py openqa/report/*.py openqa/integration/*.py
            python3 openqa/production/check-nonvisual.py
            prove -Iopenqa/t/lib -Iopenqa/lib openqa/t/*.t
            for script in openqa/production/*.sh data/*.sh; do bash -n "$script"; done
            shellcheck -x openqa/production/*.sh data/*.sh
            "$RUNNER_TEMP/bin/actionlint" -color \
              .github/workflows/openqa*.yml \
              .github/workflows/mirror-openqa-image.yml \
              .github/workflows/validate-iso-once.yml
            git diff --cached --check
            test "$(git write-tree)" = "15be0b4fccbab1804acea2605d92614798f49d42"
            dbus-run-session -- xvfb-run -a /usr/bin/python3 \
              openqa/integration/accessible_smoke.py
          } 2>&1 | tee "$RUNNER_TEMP/runtime-v14-validation.log"

      - name: Publish the validated implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "15be0b4fccbab1804acea2605d92614798f49d42"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'fix(openqa): use bounded positive witnesses for Calamares pages' \
            -m 'Stop a positive page lookup after one exact PID-scoped semantic witness. Errors in other branches remain blocking when no witness exists; absence, checked state and actions keep complete-tree contracts.' \
            -m 'Give only the newly launched privileged Qt provider a five-second startup grace. Steam remains excluded and screenshots remain diagnostic only.'
          test "$(git rev-parse HEAD^{tree})" = "15be0b4fccbab1804acea2605d92614798f49d42"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: openqa-runtime-v14-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-v14-validation.log
          retention-days: 7
          if-no-files-found: warn
