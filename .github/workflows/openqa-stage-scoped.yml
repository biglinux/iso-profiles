name: Validate reviewed scoped smoke correction
on:
  push:
    branches: [fix/openqa-nonvisual-accessibility-20260914]
    paths: [.github/workflows/openqa-stage-scoped.yml, .openqa-scoped-smoke.b64]
permissions:
  contents: write
jobs:
  reviewed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply and verify the reviewed tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 06056ced9d0d02b8c18c7340f7d96c0e284f4e66
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          patch = lzma.decompress(base64.b64decode(pathlib.Path('.openqa-scoped-smoke.b64').read_bytes(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'f07f2c47191bb9b4be36f3d840222171ed400815b9767fc93fb9e23a2fcad1cb'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          git rm .openqa-scoped-smoke.b64 .github/workflows/openqa-stage-scoped.yml
          test "$(git write-tree)" = 8c295f196eaf99cb553420a6a427a9d2e5dffd2a
      - name: Run regression checks
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r openqa/report/requirements.txt
          {
            python3 -m unittest discover -s data -p 'test_*.py'
            python3 -m unittest discover -s openqa/data -p 'test_*.py'
            python3 -m unittest discover -s openqa/report -p 'test_*.py'
            prove -Iopenqa/t/lib -Iopenqa/lib openqa/t/*.t
            python3 openqa/production/check-nonvisual.py
            shellcheck -x openqa/production/*.sh data/*.sh
            git diff --cached --check
          } 2>&1 | tee "$RUNNER_TEMP/scoped-validation.log"
      - name: Transfer immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args])
          expected = '8c295f196eaf99cb553420a6a427a9d2e5dffd2a'
          assert git('write-tree').decode().strip() == expected
          entries = []
          for raw in git('diff', '--cached', '--name-only', '-z').split(b'\0'):
              if not raw:
                  continue
              name = raw.decode()
              index = git('ls-files', '--stage', '--', name).decode().strip()
              if not index:
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode, sha = index.split()[:2]
              request = urllib.request.Request(
                  'https://api.github.com/repos/biglinux/iso-profiles/git/blobs',
                  data=json.dumps({'content': base64.b64encode(git('show', ':' + name)).decode(), 'encoding': 'base64'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  actual = json.load(response)['sha']
              assert actual == sha
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': sha})
          result = {'base_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(), 'parent': git('rev-parse', 'HEAD').decode().strip(), 'target_tree': expected, 'entries': entries}
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'scoped-publication.json').write_text(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: reviewed-scoped-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/scoped-publication.json
            ${{ runner.temp }}/scoped-validation.log
          retention-days: 3
          if-no-files-found: error
