name: Apply reviewed openQA runtime v8

on:
  push:
    branches:
      - fix/openqa-nonvisual-accessibility-20260914
    paths:
      - .github/workflows/apply-openqa-runtime-v8.yml

permissions:
  contents: write

concurrency:
  group: openqa-runtime-v8-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Assemble and verify the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1d185a6f1f5d84d9b0f40048caeea2acd84fbcd8 HEAD
          cat openqa/.runtime-v8.patch.part-{00..06} > "$RUNNER_TEMP/runtime-v8.patch"
          echo 'ffcfe440a1de908dcb473fdfe21cf43c06cc994471ffad19dc069d427c10691b  '"$RUNNER_TEMP/runtime-v8.patch" | sha256sum --check
          git rm openqa/.runtime-v8.patch.part-{00..06} .github/workflows/apply-openqa-runtime-v8.yml
          test "$(git write-tree)" = bb0ac59b7c3fc0d70bf702f45da17e44a16107ec
          git apply --index --whitespace=error-all "$RUNNER_TEMP/runtime-v8.patch"
          test "$(git write-tree)" = 913a66aa91c14a63780660b16cfc71ace3744030

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r openqa/report/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core \
            dbus-x11 xvfb openbox xdotool shellcheck
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate the exact implementation tree
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          {
            python3 -m unittest discover -s data -p 'test_*.py'
            python3 -m unittest discover -s openqa/data -p 'test_*.py'
            python3 -m unittest discover -s openqa/report -p 'test_*.py'
            python3 -m py_compile data/*.py openqa/production/*.py openqa/report/*.py
            python3 openqa/production/check-nonvisual.py
            prove -Iopenqa/t/lib -Iopenqa/lib openqa/t/*.t
            for script in openqa/production/*.sh data/*.sh; do bash -n "$script"; done
            shellcheck -x openqa/production/*.sh data/*.sh
            "$RUNNER_TEMP/bin/actionlint" -color \
              .github/workflows/openqa*.yml \
              .github/workflows/mirror-openqa-image.yml \
              .github/workflows/validate-iso-once.yml
            git diff --cached --check
            test "$(git write-tree)" = 913a66aa91c14a63780660b16cfc71ace3744030
            dbus-run-session -- xvfb-run -a /usr/bin/python3 \
              openqa/integration/accessible_smoke.py
          } 2>&1 | tee "$RUNNER_TEMP/runtime-v8-validation.log"

      - name: Publish the validated implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = 913a66aa91c14a63780660b16cfc71ace3744030
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(openqa): attribute cleanup and window lifecycle to the tested app' \
            -m 'Scope cleanup to the launched process tree before treating an unrelated registry failure as diagnostic degradation. Track exact window identity, SHOWING/DEFUNCT state, launch descendants and the known installer focus target. Handle reviewed embedded first-run overlays with one Escape before the documented Quit shortcut. Preserve crash, inaccessible-window, nonzero-exit and owned-process failures as blocking results.' \
            -m 'The exact target tree passed the complete Python and Perl suites, nonvisual policy, ShellCheck, actionlint and real GTK/AT-SPI integration in this workflow. A new ISO matrix remains required; this commit does not claim the release passed.'
          test "$(git rev-parse HEAD^{tree})" = 913a66aa91c14a63780660b16cfc71ace3744030
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: openqa-runtime-v8-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-v8-validation.log
          retention-days: 7
          if-no-files-found: warn
