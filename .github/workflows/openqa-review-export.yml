name: Export pinned sources for openQA review
on:
  push:
    branches: [review/openqa-main-20260924]
    paths: [.github/workflows/openqa-review-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: b4be7873d3dd10f2578fbb09e555d7f3b8fd401b
          persist-credentials: false
      - name: Export exact tracked source tree
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review"
          test "$(git rev-parse HEAD)" = b4be7873d3dd10f2578fbb09e555d7f3b8fd401b
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/review/source-identity.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/review/main-source.tar.gz"
          git ls-tree -r HEAD > "$RUNNER_TEMP/review/main-files.txt"
      - name: Export isolated lint executables
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review/tools"
          cp /usr/bin/shellcheck "$RUNNER_TEMP/review/tools/"
          GOBIN="$RUNNER_TEMP/review/tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/review/tools/shellcheck" --version > "$RUNNER_TEMP/review/tool-versions.txt"
          "$RUNNER_TEMP/review/tools/actionlint" -version >> "$RUNNER_TEMP/review/tool-versions.txt"
          cd "$RUNNER_TEMP/review"
          sha256sum main-source.tar.gz tools/* > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: openqa-main-review-export-${{ github.run_id }}
          path: ${{ runner.temp }}/review/
          if-no-files-found: error
          retention-days: 7
