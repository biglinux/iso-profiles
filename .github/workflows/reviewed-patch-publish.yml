name: Validate single artifact correction
on:
  push:
    branches: [fix/openqa-nonvisual-accessibility-20260914]
    paths: [.reviewed-completion.xz, .github/workflows/reviewed-patch-publish.yml]
permissions:
  contents: write
jobs:
  reviewed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply exact reviewed tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 8c6f7d51a003e9eca91d89395bf9857791355962
          python3 - <<'PY'
          import hashlib, lzma, subprocess
          patch = lzma.decompress(open('.reviewed-completion.xz', 'rb').read())
          assert hashlib.sha256(patch).hexdigest() == '614d7db12af100af664c26c2b1ae2858c1caff9127f36dbaae7d3be9e2b5bbab'
          subprocess.run(['git', 'apply', '--index'], input=patch, check=True)
          PY
          git rm .reviewed-completion.xz .github/workflows/reviewed-patch-publish.yml
          test "$(git write-tree)" = 9d5e7d389860227de38a72f6d9173b667581a07b
          python3 -m pip install --quiet --disable-pip-version-check -r openqa/report/requirements.txt
          python3 -m unittest discover -s openqa/report -p 'test_*.py'
          shellcheck -x openqa/production/*.sh data/*.sh
          git diff --cached --check
      - name: Publish immutable blobs without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args])
          expected = '9d5e7d389860227de38a72f6d9173b667581a07b'
          assert os.environ['GITHUB_REPOSITORY'] == 'biglinux/iso-profiles'
          assert git('write-tree').decode().strip() == expected
          entries = []
          for raw in git('diff', '--cached', '--name-only', '-z').split(b'\0'):
              if not raw:
                  continue
              name = raw.decode()
              entry = git('ls-files', '--stage', '--', name).decode().split()
              if not entry:
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode, sha = entry[:2]
              content = git('show', ':' + name)
              request = urllib.request.Request('https://api.github.com/repos/biglinux/iso-profiles/git/blobs',
                  data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(content).decode()}).encode(),
                  method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                    'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  assert json.load(response)['sha'] == sha
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': sha})
          manifest = {'parent_sha': git('rev-parse', 'HEAD').decode().strip(),
              'base_tree_sha': git('rev-parse', 'HEAD^{tree}').decode().strip(),
              'tree_sha': expected, 'tree_elements': entries, 'branch_moved': False}
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'publication.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-layout-${{ github.run_id }}
          path: ${{ runner.temp }}/publication.json
          if-no-files-found: error
          retention-days: 7
