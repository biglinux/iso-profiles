name: Make Profiles

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'With TMATE'
        required: false
        default: false

  schedule:
    - cron:  '0 0 * * 5'

  push:
    branches-ignore:
      - openqa-single-instance-experiment
    paths:
      - "sources/**"
      - ".github/workflows/make-profiles.yml"

env:
  # Upstream package lists this repository rebases on.
  manjaroProfiles: manjaro-iso-profiles
  # Hand-maintained inputs: the only directory a person should edit.
  sourcesDir: sources
  # Committed output the ISO builders read. manjaro-tools resolves a profile
  # with `find <repo> -maxdepth 2 -name <edition>`, so editions must stay
  # exactly one level below this directory.
  generatedDir: biglinux
  # Intermediate shared base. Never committed: .gitignore holds it.
  commonBase: common-base
  # Editions to build, in order. xivastudio must come after kde: its
  # special-commands.sh appends the generated kde Packages-Desktop to its own.
  editions: kde xivastudio

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Tmate ##
      - name: Setup TMATE Session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: Clone ManjaroIsoProfile
        shell: bash
        run: |
          # clone or Update git
          if [ ! -d "$manjaroProfiles" ]; then
              git clone https://gitlab.manjaro.org/profiles-and-settings/iso-profiles.git $manjaroProfiles
          else
              pushd $manjaroProfiles
              git pull
              popd
          fi

      - name: Build common base
        shell: bash
        run: |
          set -euo pipefail
          common=$sourcesDir/common

          rm -rf "$commonBase"
          mkdir -p "$commonBase"

          # Settings are ours outright: copied, not merged.
          cp "$common/profile.conf" "$common/user-repos.conf" "$commonBase/"

          # Overlays keep the directory names manjaro-tools expects.
          cp -r "$common/overlays/root/"    "$commonBase/root-overlay"
          cp -r "$common/overlays/desktop/" "$commonBase/desktop-overlay"
          cp -r "$common/overlays/live/"    "$commonBase/live-overlay"

          # Package lists are Manjaro's, minus <kind>-remove, plus <kind>-add.
          #
          # grep -vF matches a SUBSTRING, on purpose: "libva-mesa" in
          # Mhwd-remove is the prefix that drops Manjaro's libva-mesa-driver.
          # -F keeps '+' and '.' literal so a name like memtest86+ cannot behave
          # as a regex. Write a longer prefix when a short one would take
          # packages you want to keep.
          for kind in Mhwd Root Live; do
              for step in remove add; do
                  test -e "$common/$kind-$step" || { echo "ERROR: missing $common/$kind-$step"; exit 1; }
              done
              grep -vF -f "$common/$kind-remove" "$manjaroProfiles/shared/Packages-$kind" > "$commonBase/Packages-$kind"
              cat "$common/$kind-add" >> "$commonBase/Packages-$kind"
          done

      - name: Generate editions
        shell: bash
        run: |
          set -euo pipefail

          for i in $editions; do
              echo ""
              echo "MAKE $i"
              echo ""
              src=$sourcesDir/editions/$i
              out=$generatedDir/$i

              # Every edition starts as an exact copy of the common base.
              rsync -aCv --delete "$commonBase/" "$out"

              # Packages-Desktop has no Manjaro base: Desktop-add IS the list.
              if [ ! -e "$src/Desktop-add" ]; then
                  echo "ERROR: missing $src/Desktop-add"
                  exit 1
              fi
              cat "$src/Desktop-add" > "$out/Packages-Desktop"

              # Optional per-edition trims and additions on top of the base.
              if [ -e "$src/Root-remove" ]; then
                  grep -vF -f "$src/Root-remove" "$commonBase/Packages-Root" > "$out/Packages-Root"
              fi
              if [ -e "$src/Live-add" ]; then
                  cat "$src/Live-add" >> "$out/Packages-Live"
              fi

              # Anything the add/remove files cannot express. Runs from the
              # repository root and edits $generatedDir/$i in place.
              if [ -e "$src/special-commands.sh" ]; then
                  bash -x "$src/special-commands.sh"
              fi
          done

          # Neither the upstream clone nor the intermediate base is committed.
          rm -rf "$manjaroProfiles" "$commonBase"

      - name: Update github
        run: |
          git add --all
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -n "$(git commit -m "new profile" -a | grep "nothing to commit")" ];then exit 0; fi

      - name: Push changes
        uses: ad-m/github-push-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
