name: Apply reviewed openQA runtime v11

on:
  push:
    branches:
      - fix/openqa-nonvisual-accessibility-20260914
    paths:
      - .github/workflows/apply-openqa-runtime-v11.yml
      - openqa/.runtime-v11.patch.xz.b64

permissions:
  contents: write

concurrency:
  group: openqa-runtime-v11-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 48d178c7b4361fe5f2a84739863513f19ee665aa
          echo '0bb25057034b0fb719425fac8c68d78f0e67e7b544c71667f1f1e91710854ec9  openqa/.runtime-v11.patch.xz.b64.decoded' > "$RUNNER_TEMP/runtime-v11-xz.sha256"
          base64 --decode openqa/.runtime-v11.patch.xz.b64 > openqa/.runtime-v11.patch.xz.b64.decoded
          sha256sum --check "$RUNNER_TEMP/runtime-v11-xz.sha256"
          xz --decompress --stdout openqa/.runtime-v11.patch.xz.b64.decoded > "$RUNNER_TEMP/runtime-v11.patch"
          echo '22a23e2164c00e5eb48f726de7e7bbf88084abfed5ccd403fde55c7ab9b8dc07  '"$RUNNER_TEMP/runtime-v11.patch" | sha256sum --check
          rm openqa/.runtime-v11.patch.xz.b64.decoded
          git rm openqa/.runtime-v11.patch.xz.b64 .github/workflows/apply-openqa-runtime-v11.yml
          test "$(git write-tree)" = bab0a676800ee951bfb0c8606a361ee24c0d3a1f
          git apply --index --whitespace=error-all "$RUNNER_TEMP/runtime-v11.patch"
          test "$(git write-tree)" = 1a9d57e2cdff197fedf696fbcb693cb7f4e586fb

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r openqa/report/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core \
            dbus-x11 xvfb openbox xdotool shellcheck
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate the exact implementation tree
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          {
            python3 -m unittest discover -s data -p 'test_*.py'
            python3 -m unittest discover -s openqa/data -p 'test_*.py'
            python3 -m unittest discover -s openqa/report -p 'test_*.py'
            python3 -m py_compile data/*.py openqa/production/*.py openqa/report/*.py openqa/integration/*.py
            python3 openqa/production/check-nonvisual.py
            prove -Iopenqa/t/lib -Iopenqa/lib openqa/t/*.t
            for script in openqa/production/*.sh data/*.sh; do bash -n "$script"; done
            shellcheck -x openqa/production/*.sh data/*.sh
            "$RUNNER_TEMP/bin/actionlint" -color \
              .github/workflows/openqa*.yml \
              .github/workflows/mirror-openqa-image.yml \
              .github/workflows/validate-iso-once.yml
            git diff --cached --check
            test "$(git write-tree)" = 1a9d57e2cdff197fedf696fbcb693cb7f4e586fb
            dbus-run-session -- xvfb-run -a /usr/bin/python3 \
              openqa/integration/accessible_smoke.py
          } 2>&1 | tee "$RUNNER_TEMP/runtime-v11-validation.log"

      - name: Publish the validated implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = 1a9d57e2cdff197fedf696fbcb693cb7f4e586fb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(openqa): preserve supervised GUI ownership after reparenting' \
            -m 'Track live descendants, previously proven window PIDs and members of the supervised POSIX process group. This keeps PID-scoped AT-SPI discovery bounded when a launcher exits and its GUI is reparented, without accepting names, coordinates, screenshots or process lifetime as proof.' \
            -m 'Do not widen cleanup to unrelated groups. Steam remains an explicit bootstrap exclusion. The exact tree passed Python, Perl, nonvisual policy, ShellCheck, actionlint and real GTK/AT-SPI integration in this workflow; a new ISO matrix is still required.'
          test "$(git rev-parse HEAD^{tree})" = 1a9d57e2cdff197fedf696fbcb693cb7f4e586fb
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: openqa-runtime-v11-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-v11-validation.log
          retention-days: 7
          if-no-files-found: warn
