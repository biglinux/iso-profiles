name: Validate observed focus readiness
on:
  push:
    branches: [fix/openqa-nonvisual-accessibility-20260914]
    paths: [.github/workflows/openqa-stage-focus.yml, .openqa-focus-state.patch]
permissions:
  contents: write
jobs:
  reviewed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply checksum-pinned change and verify the target tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = f2749233426d9b36bb79dbb72eaad82e7a2d8563
          echo '66d687bcdf4a297ddfa50a5aae2d9a275d0cb2794e1df3b8fba052ac280d5023  .openqa-focus-state.patch' | sha256sum --check
          git apply --index .openqa-focus-state.patch
          git rm .openqa-focus-state.patch .github/workflows/openqa-stage-focus.yml
          test "$(git write-tree)" = c479de78c7eb6328a1a1fa62ca8289c3b85fed94
      - name: Install isolated test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -r openqa/report/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core dbus-x11 xvfb openbox xdotool
      - name: Validate regressions and real GUI integration
        run: |
          set -euo pipefail
          ulimit -c 0
          {
            python3 -m unittest discover -s data -p 'test_*.py'
            python3 -m unittest discover -s openqa/data -p 'test_*.py'
            python3 -m unittest discover -s openqa/report -p 'test_*.py'
            prove -Iopenqa/t/lib -Iopenqa/lib openqa/t/*.t
            python3 openqa/production/check-nonvisual.py
            shellcheck -x openqa/production/*.sh data/*.sh
            git diff --cached --check
            dbus-run-session -- xvfb-run -a /usr/bin/python3 openqa/integration/accessible_smoke.py
          } 2>&1 | tee "$RUNNER_TEMP/focus-validation.log"
      - name: Transfer tested immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args])
          expected = 'c479de78c7eb6328a1a1fa62ca8289c3b85fed94'
          assert git('write-tree').decode().strip() == expected
          entries = []
          for raw in git('diff', '--cached', '--name-only', '-z').split(b'\0'):
              if not raw:
                  continue
              name = raw.decode()
              index = git('ls-files', '--stage', '--', name).decode().strip()
              if not index:
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode, sha = index.split()[:2]
              request = urllib.request.Request(
                  'https://api.github.com/repos/biglinux/iso-profiles/git/blobs',
                  data=json.dumps({'content': base64.b64encode(git('show', ':' + name)).decode(), 'encoding': 'base64'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  actual = json.load(response)['sha']
              assert actual == sha
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': sha})
          result = {'base_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(), 'parent': git('rev-parse', 'HEAD').decode().strip(), 'target_tree': expected, 'entries': entries}
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'focus-publication.json').write_text(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: reviewed-focus-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/focus-publication.json
            ${{ runner.temp }}/focus-validation.log
          retention-days: 3
          if-no-files-found: error
