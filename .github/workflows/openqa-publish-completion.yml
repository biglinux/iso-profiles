name: Validate reviewed report pipeline completion

on:
  push:
    branches: [fix/openqa-nonvisual-accessibility-20260914]
    paths: [.openqa-completion.patch.xz, .github/workflows/openqa-publish-completion.yml]

permissions:
  contents: write

jobs:
  reviewed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply checksum-pinned reviewed correction
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 20d411e984b7cf0b718c78372f65393540f63f3f
          python3 - <<'PY'
          import hashlib, lzma, os, pathlib, subprocess
          patch = lzma.decompress(pathlib.Path('.openqa-completion.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == 'ca69d4ad5cdf8a797a699e4ea34b3ebe32f8c8a3930925700283db99201e812e'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'completion.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          PY
          git rm -- .openqa-completion.patch.xz .github/workflows/openqa-publish-completion.yml
          test "$(git write-tree)" = 1bddf61fe5195c3f06a7b14c3e4687e91d9a4f60
      - name: Run regression checks on the exact target tree
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check -r openqa/report/requirements.txt
          {
            python3 -m unittest discover -s data -p 'test_*.py'
            python3 -m unittest discover -s openqa/data -p 'test_*.py'
            python3 -m unittest discover -s openqa/report -p 'test_*.py'
            prove -Iopenqa/t/lib -Iopenqa/lib openqa/t/*.t
            python3 openqa/production/check-nonvisual.py
            python3 -m py_compile data/*.py openqa/production/*.py openqa/report/*.py openqa/integration/*.py
            for script in openqa/production/*.sh data/*.sh; do bash -n "$script"; done
            git diff --cached --check
          } 2>&1 | tee "$RUNNER_TEMP/completion-validation.log"
          test "$(git write-tree)" = 1bddf61fe5195c3f06a7b14c3e4687e91d9a4f60
      - name: Transfer immutable tested blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args])
          assert os.environ['GITHUB_REPOSITORY'] == 'biglinux/iso-profiles'
          expected = '1bddf61fe5195c3f06a7b14c3e4687e91d9a4f60'
          assert git('write-tree').decode().strip() == expected
          entries = []
          for raw in git('diff', '--cached', '--name-only', '-z').split(b'\0'):
              if not raw:
                  continue
              name = raw.decode()
              index = git('ls-files', '--stage', '--', name).decode().strip()
              if not index:
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode, sha = index.split()[:2]
              assert mode in ('100644', '100755')
              content = git('show', ':' + name)
              request = urllib.request.Request(
                  'https://api.github.com/repos/biglinux/iso-profiles/git/blobs',
                  data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(content).decode()}).encode(),
                  method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                    'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  uploaded = json.load(response)
              assert uploaded['sha'] == sha
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': sha})
          manifest = {'parent_sha': git('rev-parse', 'HEAD').decode().strip(),
                      'base_tree_sha': git('rev-parse', 'HEAD^{tree}').decode().strip(),
                      'tree_sha': expected, 'tree_elements': entries, 'branch_moved': False}
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'completion-publication.json'
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: openqa-completion-reviewed-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/completion-publication.json
            ${{ runner.temp }}/completion-validation.log
          if-no-files-found: error
          retention-days: 7
