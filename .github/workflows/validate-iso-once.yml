name: Verify openQA with the published ISO

# Revalidate the reviewed September ISO after runtime-v15 matches the branded
# Calamares welcome heading and uses directed, exact PID-scoped semantic
# witnesses. Top-level discovery reads role and name before expensive state;
# descendant calls return to the normal bounded AT-SPI timeout. Hidden,
# insensitive, ambiguous, incomplete and out-of-scope controls remain blocking.
# No title, coordinate or screenshot fallback is introduced. Steam remains an
# explicit bootstrap exclusion. This trigger follows validated implementation
# commit 5ea0ee23ca0f6e118fcbdc124c25b8cb65917dd2.
# This review-branch workflow never publishes an ISO release.
on:
  push:
    branches: [fix/openqa-nonvisual-accessibility-20260914]
    paths: [.github/workflows/validate-iso-once.yml, openqa/openqa-image.txt]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  runner-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/mirror-openqa-image.yml

  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch the reviewed published candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE: biglinux_2026-09-09_k618-r30
          ISO: biglinux_2026-09-09_k618.iso
        run: |
          set -euo pipefail
          sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/openqa-review-input
          gh release download "$RELEASE" --repo "$REPOSITORY" --dir /mnt/openqa-review-input \
            --pattern "$ISO.7z.*" --pattern "$ISO.sha256" --pattern "$ISO.md5"
          cd /mnt/openqa-review-input
          7z x -y "$ISO.7z.001"
          sha256sum --check "$ISO.sha256"
          md5sum --check "$ISO.md5"
          rm -- "$ISO.7z."*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-iso-${{ github.run_id }}
          path: /mnt/openqa-review-input/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  validation:
    if: ${{ always() }}
    needs: [candidate, runner-image]
    uses: ./.github/workflows/openqa-single-instance-experiment.yml
    with:
      candidate_artifact: review-iso-${{ github.run_id }}
      iso_filename: biglinux_2026-09-09_k618.iso
      version: review
      build_id: review-${{ github.run_id }}
