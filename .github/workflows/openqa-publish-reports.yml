name: Validate reviewed always-on reports
on:
  push:
    branches: [fix/openqa-nonvisual-accessibility-20260914]
    paths: ['.github/workflows/openqa-publish-reports.yml', '.openqa-report-review-*']
permissions:
  contents: write
jobs:
  reviewed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply exactly the locally validated patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = eb14d4404052ccbb9eb345dfc468aa77f0a417ec
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess, os
          encoded = b''.join(pathlib.Path(f'.openqa-report-review-{i}').read_bytes() for i in range(6))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '7d833b2c8c31aa6bd1ee23ae22856905d20b2460017e4dc712a24cd9b4fc07e5'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reports.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          PY
          git rm -- .openqa-report-review-* .github/workflows/openqa-publish-reports.yml
          test "$(git write-tree)" = 1ad7447c85e0853d47de0c8ee8b019782934c3b7
      - name: Validate reports including injected failures
        run: |
          set -euo pipefail
          {
            python3 -m unittest discover -s data -p 'test_*.py'
            python3 -m unittest discover -s openqa/data -p 'test_*.py'
            python3 -m unittest discover -s openqa/report -p 'test_*.py'
            prove -Iopenqa/t/lib -Iopenqa/lib openqa/t/*.t
            python3 openqa/production/check-nonvisual.py
            python3 -m py_compile data/*.py openqa/production/*.py openqa/report/*.py
            for script in openqa/production/*.sh data/*.sh; do bash -n "$script"; done
            ruby -ryaml -e 'ARGV.each { |f| YAML.safe_load_file(f, permitted_classes: [], aliases: false) }' .github/workflows/openqa*.yml openqa/*.yaml
            git diff --cached --check
          } 2>&1 | tee "$RUNNER_TEMP/reports-validation.log"
          test "$(git write-tree)" = 1ad7447c85e0853d47de0c8ee8b019782934c3b7
      - name: Publish tested immutable blobs (no branch changes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args])
          assert os.environ['GITHUB_REPOSITORY'] == 'biglinux/iso-profiles'
          expected = '1ad7447c85e0853d47de0c8ee8b019782934c3b7'
          assert git('write-tree').decode().strip() == expected
          entries = []
          for raw in git('diff', '--cached', '--name-only', '-z').split(b'\0'):
              if not raw:
                  continue
              name = raw.decode('utf-8')
              index = git('ls-files', '--stage', '--', name).decode().strip()
              if not index:
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode, expected_blob = index.split()[:2]
              assert mode in ('100644', '100755')
              content = git('show', ':' + name).decode('utf-8')
              request = urllib.request.Request(
                  'https://api.github.com/repos/biglinux/iso-profiles/git/blobs',
                  data=json.dumps({'content': content, 'encoding': 'utf-8'}).encode('utf-8'), method='POST',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  sha = json.load(response)['sha']
              assert sha == expected_blob
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': sha})
          manifest = {'parent': git('rev-parse', 'HEAD').decode().strip(), 'tree': expected,
                      'entries': entries, 'iso_executed': False}
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reports-publication.json'
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: openqa-reviewed-reports-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reports-publication.json
            ${{ runner.temp }}/reports-validation.log
          if-no-files-found: error
          retention-days: 7
