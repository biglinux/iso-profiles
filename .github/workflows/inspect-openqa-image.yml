name: Inspect the unavailable openQA runner image
on:
  push:
    branches: [fix/openqa-nonvisual-accessibility-20260914]
    paths: [.github/workflows/inspect-openqa-image.yml]
permissions:
  contents: read
  packages: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Inspect the exact mirror and current upstream tags
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream=registry.opensuse.org/devel/openqa/containers/opensuse/openqa-single-instance
          digest=$(sed 's/.*@//' openqa/openqa-image.txt)
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "ghcr.io/${GITHUB_REPOSITORY,,}/openqa-single-instance@$digest" > "$RUNNER_TEMP/mirror-manifest.json"; then
            echo "Exact mirror is available: $digest"
          else
            echo "Exact mirror is unavailable: $digest"
          fi
          curl --fail --silent --show-error --retry 2 --max-time 60 \
            "https://$upstream/../" >/dev/null 2>&1 || true
          curl --fail --silent --show-error --retry 2 --max-time 60 \
            https://registry.opensuse.org/v2/devel/openqa/containers/opensuse/openqa-single-instance/tags/list \
            > "$RUNNER_TEMP/upstream-tags.json"
          cat "$RUNNER_TEMP/upstream-tags.json"
          docker manifest inspect "$upstream:latest" > "$RUNNER_TEMP/upstream-manifest.json"
          docker buildx imagetools inspect "$upstream:latest" | tee "$RUNNER_TEMP/upstream-image.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: openqa-image-inspection-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mirror-manifest.json
            ${{ runner.temp }}/upstream-tags.json
            ${{ runner.temp }}/upstream-manifest.json
            ${{ runner.temp }}/upstream-image.txt
          retention-days: 3
          if-no-files-found: error
