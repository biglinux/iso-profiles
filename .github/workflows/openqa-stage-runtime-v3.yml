name: Validate scoped runtime evidence v3
on:
  push:
    branches: [fix/openqa-nonvisual-accessibility-20260914]
    paths:
      - .github/workflows/openqa-stage-runtime-v3.yml
      - .openqa-runtime-v3-transform.xz.b64
permissions:
  contents: write
jobs:
  reviewed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply the reviewed transformation to its exact parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 9129cdc6bd45adc288a7ba29eab36a94713691bd
          test "$(git hash-object .openqa-runtime-v3-transform.xz.b64)" = 0ba804af40c6b091e19ae62f46a2377b5c398f97
          echo '6c7e033b6fa344e7b33a1ebb17a2fd3bdc08698e29e4bc90e21132c1623c3351  .openqa-runtime-v3-transform.xz.b64' | sha256sum --check
          base64 --decode .openqa-runtime-v3-transform.xz.b64 | xz --decompress > "$RUNNER_TEMP/runtime-v3-transform.py"
          echo 'b280556687e43c2d7833664bac6bbd01a2839aa8edbeb836eaf0d642e9144f81  '"$RUNNER_TEMP/runtime-v3-transform.py" | sha256sum --check
          python3 "$RUNNER_TEMP/runtime-v3-transform.py"
          git rm .openqa-runtime-v3-transform.xz.b64 .github/workflows/openqa-stage-runtime-v3.yml
          git add -A
          git diff --cached --check
      - name: Install isolated integration dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -r openqa/report/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core dbus-x11 xvfb openbox xdotool shellcheck
      - name: Validate contracts, reports and real AT-SPI fixture
        run: |
          set -euo pipefail
          ulimit -c 0
          {
            python3 -m unittest discover -s data -p 'test_*.py'
            python3 -m unittest discover -s openqa/data -p 'test_*.py'
            python3 -m unittest discover -s openqa/report -p 'test_*.py'
            python3 -m py_compile data/*.py openqa/data/*.py openqa/production/*.py openqa/report/*.py
            prove -Iopenqa/t/lib -Iopenqa/lib openqa/t/*.t
            python3 openqa/production/check-nonvisual.py
            for script in openqa/production/*.sh data/*.sh; do bash -n "$script"; done
            shellcheck -x openqa/production/*.sh data/*.sh
            git diff --cached --check
            dbus-run-session -- xvfb-run -a /usr/bin/python3 openqa/integration/accessible_smoke.py
          } 2>&1 | tee "$RUNNER_TEMP/runtime-v3-validation.log"
      - name: Transfer tested immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args])
          entries = []
          for raw in git('diff', '--cached', '--name-only', '-z').split(b'\0'):
              if not raw:
                  continue
              name = raw.decode()
              index = git('ls-files', '--stage', '--', name).decode().strip()
              if not index:
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode, sha = index.split()[:2]
              request = urllib.request.Request(
                  'https://api.github.com/repos/biglinux/iso-profiles/git/blobs',
                  data=json.dumps({'content': base64.b64encode(git('show', ':' + name)).decode(), 'encoding': 'base64'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  uploaded = json.load(response)['sha']
              assert uploaded == sha
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': sha})
          result = {
              'parent': git('rev-parse', 'HEAD').decode().strip(),
              'base_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(),
              'target_tree': git('write-tree').decode().strip(),
              'transform_blob': '0ba804af40c6b091e19ae62f46a2377b5c398f97',
              'transform_sha256': 'b280556687e43c2d7833664bac6bbd01a2839aa8edbeb836eaf0d642e9144f81',
              'entries': entries,
          }
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'runtime-v3-publication.json').write_text(
              json.dumps(result, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: reviewed-runtime-v3-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/runtime-v3-publication.json
            ${{ runner.temp }}/runtime-v3-validation.log
          retention-days: 3
          if-no-files-found: warn
