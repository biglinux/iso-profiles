name: Apply reviewed openQA Collection v15

on:
  push:
    branches:
      - review/openqa-collection-v15-20260916
    paths:
      - .github/workflows/apply-openqa-collection-v15.yml
      - openqa/.collection-v15.patch.xz.b64

permissions:
  contents: write

concurrency:
  group: openqa-collection-v15-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct the reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "9c66f85cd184bb213b835e1a297409013299058e" HEAD
          echo '98aeeee9569cb07a1c6423b695120a1e26317b46f0d7f5eac9ea7f3ad0cee133  openqa/.collection-v15.patch.xz.b64' | sha256sum --check
          base64 --decode openqa/.collection-v15.patch.xz.b64 > "$RUNNER_TEMP/collection-v15.patch.xz"
          echo '2883366e250368cf804281d47f04e15abcda3123b7ad053fcf72e4579850cccf  '"$RUNNER_TEMP/collection-v15.patch.xz" | sha256sum --check
          xz --decompress --stdout "$RUNNER_TEMP/collection-v15.patch.xz" > "$RUNNER_TEMP/collection-v15.patch"
          echo 'fdf87a8c65890286e8e06179106364b13ce228cace0fcc6925dc7fb2ad262247  '"$RUNNER_TEMP/collection-v15.patch" | sha256sum --check
          git rm openqa/.collection-v15.patch.xz.b64 .github/workflows/apply-openqa-collection-v15.yml
          test "$(git write-tree)" = "5472ee70db268c2dd40fd21b5bcb0c051a5ac9be"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/collection-v15.patch"
          test "$(git write-tree)" = "b3558c96dbf2b6d5b29a77366066c4e190c0d410"
          diff -u \
            <(printf '%s\n' \
              data/atspi_probe.py \
              data/test_atspi_probe.py \
              docs/openqa-runtime-validation.md \
              openqa/integration/accessible_smoke.py) \
            <(git diff --cached --diff-filter=AM --name-only)

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r openqa/report/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core \
            dbus-x11 xvfb openbox xdotool shellcheck
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate the exact target tree
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          {
            python3 -m unittest discover -s data -p 'test_*.py'
            python3 -m unittest discover -s openqa/data -p 'test_*.py'
            python3 -m unittest discover -s openqa/report -p 'test_*.py'
            python3 -m py_compile \
              data/*.py openqa/production/*.py openqa/report/*.py openqa/integration/*.py
            python3 openqa/production/check-nonvisual.py
            prove -Iopenqa/t/lib -Iopenqa/lib openqa/t/*.t
            for script in openqa/production/*.sh data/*.sh; do bash -n "$script"; done
            shellcheck -x openqa/production/*.sh data/*.sh
            "$RUNNER_TEMP/bin/actionlint" -color \
              .github/workflows/openqa*.yml \
              .github/workflows/mirror-openqa-image.yml \
              .github/workflows/validate-iso-once.yml
            git diff --cached --check
            test "$(git write-tree)" = "b3558c96dbf2b6d5b29a77366066c4e190c0d410"
            dbus-run-session -- xvfb-run -a /usr/bin/python3 \
              openqa/integration/accessible_smoke.py
          } 2>&1 | tee "$RUNNER_TEMP/openqa-collection-v15.log"

      - name: Publish the validated review tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "b3558c96dbf2b6d5b29a77366066c4e190c0d410"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(openqa): use provider-side Collection for positive witnesses' \
            -m 'Query exact roles and SHOWING state through the provider AT-SPI Collection interface for positive existence witnesses, then revalidate returned objects with the existing semantic record checks. Keep negative, checked and action paths on the complete bounded walk.' \
            -m 'Fallback only when Collection is unsupported. Provider errors and capped result sets remain incomplete, never absence or success. Validate the real GI Collection path in GTK/AT-SPI integration.'
          test "$(git rev-parse HEAD^{tree})" = "b3558c96dbf2b6d5b29a77366066c4e190c0d410"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: openqa-collection-v15-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openqa-collection-v15.log
          retention-days: 7
          if-no-files-found: warn
