version: 2

# Every installed Desktop Entry remains in the inventory. Entries below are
# classified explicitly because they are services, helpers, protocol handlers,
# or commands that require an external input and cannot be launched as a
# standalone graphical application.
exclude:
  - desktop_id: ail-cli.desktop
    reason: Command-line AppImageLauncher helper; it has no standalone graphical window
  - desktop_id: appimagelauncher.desktop
    reason: AppImage handler requires an AppImage file argument
  - desktop_id: big-executable.desktop
    reason: File handler requires an executable file argument
  - desktop_id: bigcontrolcenter/cups.desktop
    reason: Opens the printer administration page with xdg-open, so the window belongs to the browser
  - desktop_id: bigcontrolcenter/qvidcap.desktop
    reason: Video capture utility requires physical V4L2 capture hardware unavailable in CI
  - desktop_id: bigtts.desktop
    reason: Selected-text handler requires text supplied by the desktop selection
  - desktop_id: com.github.maliit.keyboard.desktop
    reason: Input-method component is managed by the desktop session, not launched standalone
  - desktop_id: fcitx5-wayland-launcher.desktop
    reason: Fcitx Wayland session component is managed by the login session
  - desktop_id: gcr-prompter.desktop
    reason: Authentication prompter requires a request from another application
  - desktop_id: geoclue-demo-agent.desktop
    reason: Geolocation agent is a background service without a standalone window
  - desktop_id: google-maps-geo-handler.desktop
    reason: Geographic URI handler requires a geo URI argument
  - desktop_id: io.snapcraft.SessionAgent.desktop
    reason: Snap session agent is managed by the desktop session and has no standalone window
  - desktop_id: java-open.desktop
    reason: Java archive handler requires a JAR file argument
  - desktop_id: kaccess.desktop
    reason: Accessibility session service is managed by the desktop session
  - desktop_id: ktelnetservice5.desktop
    reason: Telnet URI handler requires a URI argument
  - desktop_id: ktelnetservice6.desktop
    reason: Telnet URI handler requires a URI argument
  - desktop_id: net.lutris.Lutris1.desktop
    reason: Lutris installer handler requires an installer file argument
  - desktop_id: open-in-lutris.desktop
    reason: Lutris installer helper requires installer metadata
  - desktop_id: openstreetmap-geo-handler.desktop
    reason: Geographic URI handler requires a geo URI argument
  - desktop_id: org.biglinux.SnapshotRestore.desktop
    reason: >-
      Hidden pkexec helper that restores the system from a Timeshift snapshot,
      so a test must not launch it blindly. Its Exec also names
      /usr/local/bin/biglinux-snapshot-restore while the wrapper ships in
      /usr/bin, which the release gate found and which the package still needs
      to fix
  - desktop_id: org.fcitx.fcitx5-qt5-gui-wrapper.desktop
    reason: Fcitx Qt 5 wrapper is an input-method session component
  - desktop_id: org.fcitx.fcitx5-qt6-gui-wrapper.desktop
    reason: Fcitx Qt 6 wrapper is an input-method session component
  - desktop_id: org.freedesktop.Xwayland.desktop
    reason: Xwayland is a display-server component managed by the desktop session
  - desktop_id: org.freedesktop.impl.portal.desktop.kde.desktop
    reason: KDE desktop portal is a D-Bus service without a standalone window
  - desktop_id: org.gnome.Zenity.desktop
    reason: Dialog helper requires dialog options or input from a caller
  - desktop_id: org.gnupg.pinentry-qt.desktop
    reason: Pinentry requires the Assuan protocol from a requesting process
  - desktop_id: org.kde.ConfigurePrinter.desktop
    reason: Printer configuration helper requires an existing printer context
  - desktop_id: org.kde.baloorunner.desktop
    reason: KDE service entry has no executable command
  - desktop_id: org.kde.bluedevilsendfile.desktop
    reason: Bluetooth file-transfer handler requires a file or device context
  - desktop_id: org.kde.gwenview_importer.desktop
    reason: Gwenview importer requires removable-media or file input
  - desktop_id: org.kde.kded5.desktop
    reason: KDE service entry is not a graphical application
  - desktop_id: org.kde.kded6.desktop
    reason: KDE service entry is not a graphical application
  - desktop_id: org.kde.kdeconnect.daemon.desktop
    reason: KDE Connect daemon is a background session service
  - desktop_id: org.kde.kdeconnect.nonplasma.desktop
    reason: Non-Plasma KDE Connect indicator is a session component, not a standalone application in Plasma
  - desktop_id: org.kde.kdialog.desktop
    reason: Dialog helper requires options or input from a caller
  - desktop_id: org.kde.keditfiletype.desktop
    reason: MIME type editor requires a MIME type or file context
  - desktop_id: org.kde.kfontinst.desktop
    reason: Font installer requires a font file or URL argument
  - desktop_id: org.kde.kiod6.desktop
    reason: KIO daemon is a background service without a standalone window
  - desktop_id: org.kde.klipper.desktop
    reason: Plasma clipboard service entry intentionally uses an inactive command
  - desktop_id: org.kde.knighttimed.desktop
    reason: Night Time helper is a background service without a standalone window
  - desktop_id: org.kde.ksecretd.desktop
    reason: KDE secret service is a background session service
  - desktop_id: org.kde.kwin.dialoghelper.desktop
    reason: KDE helper entry has no executable command
  - desktop_id: org.kde.kwin.killer.desktop
    reason: KWin crash helper requires a window-manager failure context
  - desktop_id: org.kde.kwin_x11.killer.desktop
    reason: KWin X11 crash helper requires a window-manager failure context
  - desktop_id: org.kde.plasma-fallback-session-save.desktop
    reason: Plasma session helper is invoked only during session shutdown
  - desktop_id: org.kde.plasma-interactiveconsole.desktop
    reason: Plasma service entry has no executable command
  - desktop_id: org.kde.plasma.keyboard.desktop
    reason: Wayland virtual keyboard (X-KDE-Wayland-VirtualKeyboard) is started by the compositor through the input-method protocol, so it exits immediately when launched standalone
  - desktop_id: org.kde.plasmashell.desktop
    reason: Plasma shell is already running and managed by the desktop session
  - desktop_id: org.kde.plasmawindowed.desktop
    reason: Plasma widget host requires a widget package argument
  - desktop_id: org.kde.polkit-kde-authentication-agent-1.desktop
    reason: PolicyKit agent is managed by the session and only shows windows for authentication requests
  - desktop_id: org.kde.secretprompter.desktop
    reason: KDE helper entry has no executable command
  - desktop_id: pamac-installer.desktop
    reason: Package installer handler requires a package file argument
  - desktop_id: signon-ui.desktop
    reason: Account authentication UI requires a request from another process
  - desktop_id: snap-handle-link.desktop
    reason: Snap URI handler requires a snap URI argument
  - desktop_id: urxvtc.desktop
    reason: urxvt client requires an already-running urxvtd daemon
  - desktop_id: wheelmap-geo-handler.desktop
    reason: Geographic URI handler requires a geo URI argument
  - desktop_id: xdg-desktop-portal-gtk.desktop
    reason: GTK desktop portal is a D-Bus service without a standalone window
  - desktop_id: com.biglinux.calamares-config.desktop
    reason: Installer launcher is covered by the dedicated BIOS and UEFI installation plans
  - desktop_id: jnlp-check.desktop
    reason: Java Web Start helper requires a JNLP file or an external launch request
  - desktop_id: org.kde.kdeconnect.handler.desktop
    reason: KDE Connect URL handler requires a kdeconnect URI supplied by another application
  - desktop_id: org.kde.vpnimport.desktop
    reason: VPN importer requires a VPN configuration file supplied by the user
  - desktop_id: rustdesk-link.desktop
    reason: RustDesk link handler requires a rustdesk URI supplied by another application
  - desktop_id: smplayer_enqueue.desktop
    reason: SMPlayer enqueue handler requires one or more media files
  - desktop_id: steam.desktop
    reason: BigLinux ships a Steam bootstrap installer that immediately downloads and installs Steam; it is not the installed Steam client

aliases:
  - desktop_id: bigcontrolcenter/big-driver-manager.desktop
    canonical: big-driver-manager.desktop
  - desktop_id: bigcontrolcenter/big-kernel-manager.desktop
    canonical: big-kernel-manager.desktop
  - desktop_id: org.kde.plasma.settings.open.desktop
    canonical: bigcontrolcenter/systemsettings.desktop

# Per-application lifecycle contracts. Unlisted entries use the strict
# standard contract: accessible content, one close shortcut, process exit 0.
contracts:
  - desktop_id: Executar (Krunner).desktop
    kind: shared-window
    close_key: esc
    reason: KRunner is a resident Plasma service; its documented Escape shortcut hides the tested runner window without stopping the service
  - desktop_id: bigcontrolcenter/bssh.desktop
    kind: transient-dialog
    allowed_exit_codes: [0, 1]
    reason: Closing an Avahi service chooser without selecting a service returns the documented cancellation status
  - desktop_id: bigcontrolcenter/bvnc.desktop
    kind: transient-dialog
    allowed_exit_codes: [0, 1]
    reason: Closing an Avahi service chooser without selecting a service returns the documented cancellation status
  - desktop_id: org.kde.ksshaskpass.desktop
    kind: transient-dialog
    allowed_exit_codes: [0, 1]
    reason: Cancelling the credential prompt is a normal result for an isolated smoke test
  - desktop_id: bigcontrolcenter/gnome-alsamixer.desktop
    kind: standard
    requires: [alsa-card]
    reason: The mixer is applicable only when the guest exposes an ALSA hardware card
  - desktop_id: guvcview.desktop
    kind: standard
    requires: [video-device]
    reason: The webcam application is applicable only when a V4L2 capture device exists
  - desktop_id: bigcontrolcenter/qefientrymanager.desktop
    kind: standard
    requires: [uefi-variables]
    content_timeout: 15
    reason: EFI entry management is applicable only when firmware variables are exposed in the guest
  - desktop_id: yad-settings.desktop
    kind: standard
    requires: [native-x11]
    reason: This YAD settings mode explicitly supports only a native X11 session
  - desktop_id: bigcontrolcenter/hplip.desktop
    kind: shared-window
    reason: HP Device Manager may keep its notification-area service after the toolbox window closes
  - desktop_id: bigcontrolcenter/me.timschneeberger.jdsp4linux.desktop
    kind: shared-window
    reason: JamesDSP is a resident audio service with a separately closable control window
  - desktop_id: org.qbittorrent.qBittorrent.desktop
    kind: standard
    close_key: ctrl-q
    close_timeout: 30
    reason: qBittorrent documents Ctrl+Q as Exit and QApplication::exit must terminate the tested instance normally
  - desktop_id: kcm_cursortheme.desktop
    kind: shared-window
    reason: The KCM window is hosted by kcmshell6; the tested module window is the lifecycle boundary
  - desktop_id: kcm_wallpaper.desktop
    kind: shared-window
    reason: The KCM window is hosted by kcmshell6; the tested module window is the lifecycle boundary
  - desktop_id: libreoffice-base.desktop
    kind: shared-window
    close_key: alt-f4
    content_timeout: 20
    reason: LibreOffice Base opens a Database Wizard; close that exact window while allowing the shared soffice service to outlive it
  - desktop_id: libreoffice-calc.desktop
    kind: shared-window
    close_key: ctrl-q
    dismiss_auxiliary: true
    reason: LibreOffice components share the soffice process; the component window is the lifecycle boundary
  - desktop_id: libreoffice-draw.desktop
    kind: shared-window
    close_key: ctrl-q
    dismiss_auxiliary: true
    reason: LibreOffice components share the soffice process; the component window is the lifecycle boundary
  - desktop_id: libreoffice-impress.desktop
    kind: shared-window
    close_key: ctrl-q
    dismiss_auxiliary: true
    reason: LibreOffice components share the soffice process; the component window is the lifecycle boundary
  - desktop_id: libreoffice-math.desktop
    kind: shared-window
    close_key: ctrl-q
    dismiss_auxiliary: true
    reason: LibreOffice components share the soffice process; the component window is the lifecycle boundary
  - desktop_id: libreoffice-startcenter.desktop
    kind: shared-window
    close_key: ctrl-q
    dismiss_auxiliary: true
    reason: LibreOffice components share the soffice process; the component window is the lifecycle boundary
  - desktop_id: libreoffice-writer.desktop
    kind: shared-window
    close_key: ctrl-q
    dismiss_auxiliary: true
    reason: LibreOffice components share the soffice process; the component window is the lifecycle boundary
  - desktop_id: libreoffice-xsltfilter.desktop
    kind: shared-window
    close_key: ctrl-q
    dismiss_auxiliary: true
    reason: LibreOffice components share the soffice process; the component window is the lifecycle boundary
  - desktop_id: gimp.desktop
    kind: standard
    close_key: ctrl-q
    dismiss_auxiliary: true
    close_timeout: 30
    reason: GIMP performs plug-in and session shutdown work after the documented Quit shortcut
  - desktop_id: bigcontrolcenter/br.com.biglinux.networkinfo.desktop
    kind: standard
    close_key: ctrl-q
    dismiss_auxiliary: true
    close_timeout: 30
    reason: Big Network Info can present its first-run welcome surface before the application Quit action
  - desktop_id: bigcontrolcenter/designer.desktop
    kind: standard
    close_key: ctrl-q
    dismiss_auxiliary: true
    close_timeout: 30
    reason: Qt Designer opens its New Form dialog on startup before the documented Quit action
  - desktop_id: br.com.biglinux.audio.converter.desktop
    kind: standard
    close_key: ctrl-q
    dismiss_auxiliary: true
    close_timeout: 30
    reason: Audio Converter presents its first-run welcome surface before the application Quit action
  - desktop_id: br.com.biglinux.bigocrpdf-editor.desktop
    kind: standard
    close_key: ctrl-q
    dismiss_auxiliary: true
    close_timeout: 30
    reason: The PDF editor shows its help dialog on first use before the application Quit action
  - desktop_id: br.com.biglinux.bigocrpdf.desktop
    kind: standard
    close_key: ctrl-q
    dismiss_auxiliary: true
    close_timeout: 30
    reason: The OCR frontend shows its welcome or dependency dialog on first use before Quit
  - desktop_id: br.com.biglinux.converter.desktop
    kind: standard
    close_key: ctrl-q
    dismiss_auxiliary: true
    close_timeout: 30
    reason: Big Video Converter presents a welcome dialog on first activation before Quit
  - desktop_id: br.com.biglinux.webapps.desktop
    kind: standard
    close_key: ctrl-q
    dismiss_auxiliary: true
    close_timeout: 30
    reason: WebApps Manager presents its welcome dialog on first run before Quit
  - desktop_id: big-driver-manager.desktop
    kind: standard
    content_timeout: 20
    reason: The Qt Quick interface may publish its accessible content after the top-level window
  - desktop_id: big-kernel-manager.desktop
    kind: standard
    content_timeout: 20
    reason: The Qt Quick interface may publish its accessible content after the top-level window
  - desktop_id: big-store.desktop
    kind: standard
    content_timeout: 20
    reason: The store may publish its accessible web content after the top-level window
  - desktop_id: bigcontrolcenter/biglinux-config.desktop
    kind: standard
    content_timeout: 20
    reason: The web-based settings page may publish its accessible content after the top-level window
  - desktop_id: bigcontrolcenter/hp-uiscan.desktop
    kind: standard
    content_timeout: 15
    reason: The scanner UI may publish its controls after device discovery begins
  - desktop_id: bigcontrolcenter/stoken-gui-small.desktop
    kind: standard
    content_timeout: 15
    reason: The token dialog may publish its accessible controls after the top-level window
  - desktop_id: bigcontrolcenter/stoken-gui.desktop
    kind: standard
    content_timeout: 15
    reason: The token dialog may publish its accessible controls after the top-level window
  - desktop_id: brave-browser.desktop
    kind: standard
    content_timeout: 20
    reason: Chromium accessibility content is published after the browser window appears
  - desktop_id: rustdesk.desktop
    kind: standard
    content_timeout: 20
    reason: RustDesk may publish its accessible content after its renderer initializes
  - desktop_id: smplayer.desktop
    kind: standard
    content_timeout: 15
    reason: SMPlayer may publish its controls after the player window appears

# Legacy section name: selected installed-app smoke checks, not mandatory packages.
# Missing entries are not applicable; the live shards discover all installed applications.
critical:
  - desktop_id: org.kde.dolphin.desktop
    functional_test: dolphin
  - desktop_id: org.kde.konsole.desktop
    functional_test: konsole
  - desktop_id: brave-browser.desktop
    functional_test: brave
  - desktop_id: libreoffice-startcenter.desktop
    functional_test: libreoffice
  - desktop_id: gimp.desktop
    functional_test: gimp
  - desktop_id: bigcontrolcenter.desktop
    functional_test: control-center
  - desktop_id: bigcontrolcenter/mpv.desktop
    functional_test: mpv
  - desktop_id: org.kde.kate.desktop
    functional_test: kate
  - desktop_id: org.kde.okular.desktop
    functional_test: okular
  - desktop_id: org.manjaro.pamac.manager.desktop
