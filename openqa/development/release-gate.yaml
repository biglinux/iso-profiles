version: 1
application_shard_count: 4

# The module sequence for each schedule remains owned by openqa/main.pm.
# This file owns the mandatory daily firmware matrix consumed by the local
# development bridge and by the GitHub release workflow.
plans:
  - test: release_bios
    schedule: release
    firmware: bios
    kind: firmware
  - test: release_uefi
    schedule: release_uefi
    firmware: uefi
    kind: firmware
  - test: applications_shard_0
    schedule: applications
    firmware: bios
    kind: applications
    shard: 0
  - test: applications_shard_1
    schedule: applications
    firmware: bios
    kind: applications
    shard: 1
  - test: applications_shard_2
    schedule: applications
    firmware: bios
    kind: applications
    shard: 2
  - test: applications_shard_3
    schedule: applications
    firmware: bios
    kind: applications
    shard: 3
