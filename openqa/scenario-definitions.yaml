---
products:
  biglinux:
    distri: biglinux
    flavor: Live
    arch: x86_64
    version: candidate

machines:
  64bit:
    backend: qemu
    settings:
      QEMUCPUS: '2'
      QEMURAM: '4096'
      HDDSIZEGB: '40'
      XRES: '1024'
      YRES: '768'

  64bit-uefi:
    backend: qemu
    settings:
      QEMUCPUS: '2'
      QEMURAM: '4096'
      HDDSIZEGB: '40'
      QEMUMACHINE: q35
      UEFI: '1'
      UEFI_SECURE_BOOT: '0'
      XRES: '1024'
      YRES: '768'

job_templates:
  release_bios:
    product: biglinux
    machine: 64bit

  release_uefi:
    product: biglinux
    machine: 64bit-uefi
